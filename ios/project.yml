name: XunZhangZhaiJu

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant
  xcodeVersion: "26.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.10.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 9.2.0

settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  XunZhangZhaiJu:
    type: application
    platform: iOS
    sources:
      - path: XunZhangZhaiJu
      - path: ../data/app-content-manifest.json
        group: Resources/Content
        buildPhase: resources
      - path: ../data/events.json
        group: Resources/Content
        buildPhase: resources
      - path: ../data/levels.json
        group: Resources/Content
        buildPhase: resources
      - path: ../data/phrases.json
        group: Resources/Content
        buildPhase: resources
      - path: ../data/story-lore-v2.json
        group: Resources/Content
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: 尋章摘句
        CFBundleDevelopmentRegion: zh_Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        GIDServerClientID: $(GOOGLE_SERVER_CLIENT_ID)
        SyncAPIBaseURL: $(SYNC_API_BASE_URL)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.edu.hc.zgjh.xunzhangzhaiju
        PRODUCT_NAME: XunZhangZhaiJu
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Config/XunZhangZhaiJu.entitlements
        GOOGLE_IOS_CLIENT_ID: ""
        GOOGLE_SERVER_CLIENT_ID: ""
        GOOGLE_REVERSED_CLIENT_ID: ""
        SYNC_API_BASE_URL: https://xunzhang-zhaiju-sync.hk6429.workers.dev
    dependencies:
      - package: GRDB
        product: GRDB
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    scheme:
      testTargets:
        - XunZhangZhaiJuTests
        - XunZhangZhaiJuUITests
      gatherCoverageData: true

  XunZhangZhaiJuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: XunZhangZhaiJuTests
      - path: ../data/fixtures/native-parity/core-rules.json
        group: Resources/Fixtures
        buildPhase: resources
      - path: ../data/fixtures/sync/progress-v1.json
        group: Resources/Fixtures
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: tw.edu.hc.zgjh.xunzhangzhaiju.tests
    dependencies:
      - target: XunZhangZhaiJu

  XunZhangZhaiJuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: XunZhangZhaiJuUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: tw.edu.hc.zgjh.xunzhangzhaiju.uitests
    dependencies:
      - target: XunZhangZhaiJu
