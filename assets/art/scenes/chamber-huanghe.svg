<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Water & Night Sky Gradient -->
    <linearGradient id="huangheSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09182b"/>
      <stop offset="40%" stop-color="#0f2e4a"/>
      <stop offset="75%" stop-color="#19485c"/>
      <stop offset="100%" stop-color="#246a6b"/>
    </linearGradient>

    <!-- Water Rapids Gradient (青綠與金濤波浪) -->
    <linearGradient id="waterFlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e4b5b"/>
      <stop offset="30%" stop-color="#14b8a6"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <linearGradient id="goldWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </linearGradient>

    <!-- Hunyuan Jindou (混元金斗) Radiance Gradient -->
    <radialGradient id="jindouRadiance" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#b45309" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldRelic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="goldenVortex" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="waterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1920" height="1080" fill="url(#huangheSky)"/>

  <!-- Distant Taoist Cliff & Water Gates (遠景奇峰與迷仙水關) -->
  <g id="cliffs">
    <path d="M0,580 L140,240 L340,480 L480,290 L680,560 L920,380 L1150,590 L1420,280 L1680,520 L1920,320 L1920,800 L0,800 Z" fill="#0d2538" opacity="0.95"/>
    <!-- Mineral Green Shading on Mountain Ridges -->
    <path d="M120,260 L240,450 L340,480 L460,310 L580,510 L680,560 Z" fill="#115e59" opacity="0.6"/>
    <path d="M1400,300 L1520,490 L1680,520 L1800,360 L1920,440 Z" fill="#0f766e" opacity="0.6"/>
  </g>

  <!-- Nine Bends Pavilion Bridges (九曲迷仙水上廊橋與古樓) -->
  <g id="bridges" stroke="#eab308" stroke-width="2">
    <!-- Left Bridge Complex -->
    <g transform="translate(100, 380)">
      <path d="M0,120 Q120,60 260,100 T520,80" fill="none" stroke="#ca8a04" stroke-width="18"/>
      <path d="M0,120 Q120,60 260,100 T520,80" fill="none" stroke="#fef08a" stroke-width="4" stroke-dasharray="8 6"/>
      <!-- Small Pavilion atop Bridge -->
      <polygon points="220,70 260,25 300,70" fill="#b91c1c" stroke="#fde047" stroke-width="2"/>
      <rect x="240" y="70" width="40" height="30" fill="#78350f"/>
    </g>
    <!-- Right Bridge Complex -->
    <g transform="translate(1320, 360)">
      <path d="M0,100 Q140,50 280,110 T520,70" fill="none" stroke="#ca8a04" stroke-width="18"/>
      <path d="M0,100 Q140,50 280,110 T520,70" fill="none" stroke="#fef08a" stroke-width="4" stroke-dasharray="8 6"/>
      <polygon points="240,75 280,30 320,75" fill="#b91c1c" stroke="#fde047" stroke-width="2"/>
      <rect x="260" y="75" width="40" height="30" fill="#78350f"/>
    </g>
  </g>

  <!-- Surging Nine-Bends Water Whirlpools (九曲狂瀾奔湧水陣) -->
  <g id="water-vortex">
    <!-- Outer Swirling Water Layers -->
    <path d="M-100,650 C300,560 600,750 960,620 C1320,490 1620,720 2020,600 L2020,1080 L-100,1080 Z" fill="url(#waterFlow1)"/>
    <path d="M-100,720 C250,660 550,840 960,700 C1370,560 1700,820 2020,680 L2020,1080 L-100,1080 Z" fill="#0d9488" opacity="0.8"/>
    <path d="M-100,800 C350,750 700,920 960,780 C1220,640 1600,890 2020,760 L2020,1080 L-100,1080 Z" fill="#0369a1" opacity="0.75"/>
    <path d="M-100,880 C200,840 600,980 960,860 C1320,740 1750,960 2020,850 L2020,1080 L-100,1080 Z" fill="#0f172a" opacity="0.9"/>

    <!-- Foaming Crests & Golden Light on Rapids -->
    <path d="M0,670 Q320,580 640,720 T1280,630 T1920,620" fill="none" stroke="#a5f3fc" stroke-width="4" filter="url(#waterGlow)"/>
    <path d="M0,750 Q360,670 720,800 T1440,690 T1920,700" fill="none" stroke="#fef08a" stroke-width="3" filter="url(#waterGlow)" opacity="0.85"/>
    <path d="M0,840 Q400,760 800,880 T1600,780 T1920,790" fill="none" stroke="#38bdf8" stroke-width="3.5" filter="url(#waterGlow)"/>
  </g>

  <!-- Central Great Golden Relic: Hunyuan Jindou (混元金斗懸空聚氣) -->
  <g transform="translate(960, 420)">
    <!-- Massive Golden Energy Halo and Light Pillars -->
    <circle cx="0" cy="0" r="320" fill="url(#jindouRadiance)" filter="url(#goldenVortex)"/>

    <!-- Divine Vertical Beam Downwards into the Vortex -->
    <polygon points="-60,40 60,40 180,660 -180,660" fill="url(#goldWater)" filter="url(#goldenVortex)"/>

    <!-- Concentric Taoist Runes Ring around Jindou -->
    <ellipse cx="0" cy="0" rx="260" ry="110" fill="none" stroke="#fde047" stroke-width="3" stroke-dasharray="16 12" filter="url(#goldenVortex)"/>
    <ellipse cx="0" cy="0" rx="220" ry="90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- Flying Runic Seals circling the vessel -->
    <g transform="rotate(25)">
      <rect x="220" y="-25" width="40" height="70" rx="4" fill="#b91c1c" stroke="#fde047" stroke-width="2"/>
      <text x="240" y="15" fill="#fde047" font-family="'Noto Serif TC', serif" font-size="12" font-weight="900" text-anchor="middle">迷仙</text>
      <text x="240" y="32" fill="#fde047" font-family="'Noto Serif TC', serif" font-size="12" font-weight="900" text-anchor="middle">攝魄</text>
    </g>
    <g transform="rotate(-155)">
      <rect x="220" y="-25" width="40" height="70" rx="4" fill="#b91c1c" stroke="#fde047" stroke-width="2"/>
      <text x="240" y="15" fill="#fde047" font-family="'Noto Serif TC', serif" font-size="12" font-weight="900" text-anchor="middle">混元</text>
      <text x="240" y="32" fill="#fde047" font-family="'Noto Serif TC', serif" font-size="12" font-weight="900" text-anchor="middle">金斗</text>
    </g>

    <!-- The Hunyuan Jindou Sacred Vessel (混元金斗尊身) -->
    <!-- Floating Upper Rim & Handles -->
    <ellipse cx="0" cy="-60" rx="140" ry="40" fill="url(#goldRelic)" stroke="#fef08a" stroke-width="5"/>
    <ellipse cx="0" cy="-60" rx="110" ry="30" fill="#451a03" stroke="#eab308" stroke-width="3"/>
    
    <!-- Vessel Body -->
    <path d="M-140,-60 C-160,20 -100,100 -50,130 L50,130 C100,100 160,20 140,-60 Z" fill="url(#goldRelic)" stroke="#fef08a" stroke-width="4"/>
    
    <!-- Ancient Taotie / Dragon Relief Pattern on Jindou Body -->
    <circle cx="0" cy="20" r="45" fill="#713f12" stroke="#fde047" stroke-width="3"/>
    <path d="M-30,20 Q0,5 30,20 Q0,35 -30,20" fill="#fde047"/>
    <!-- Left & Right Dragon Ear Handles -->
    <path d="M-135,-40 C-185,-30 -185,20 -125,40" stroke="#fde047" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M135,-40 C185,-30 185,20 125,40" stroke="#fde047" stroke-width="12" fill="none" stroke-linecap="round"/>
    
    <!-- Vessel Base Ring -->
    <ellipse cx="0" cy="130" rx="55" ry="18" fill="#ca8a04" stroke="#fef08a" stroke-width="3"/>

    <!-- Blazing Core Flare inside the Jindou -->
    <circle cx="0" cy="-60" r="30" fill="#ffffff" filter="url(#goldenVortex)"/>
  </g>

  <!-- Water Spirit Dragons / Whispers (青龍靈水回瀾) -->
  <g stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.65" filter="url(#waterGlow)">
    <path d="M200,980 Q500,800 800,880 Q1050,960 1300,840 Q1600,720 1800,880"/>
    <path d="M100,1020 Q400,890 750,940 Q1100,990 1450,890 Q1700,810 1900,920"/>
  </g>

  <!-- Chamber Header Badge (九曲黃河密室銘牌) -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="350" height="90" rx="8" fill="#082f49" fill-opacity="0.9" stroke="#38bdf8" stroke-width="2"/>
    <text x="25" y="40" fill="#38bdf8" font-family="'Noto Serif TC', serif" font-size="24" font-weight="900">第二重關 · 九曲黃河迷仙閣</text>
    <text x="25" y="68" fill="#bae6fd" font-family="'Noto Sans TC', sans-serif" font-size="14">波濤暗湧 · 混元金斗 · 迷陣破玄機</text>
  </g>
</svg>
