<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="taijiHallAtmosphere" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Golden Energy & Lights -->
    <radialGradient id="taijiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="30%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#eab308" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#854d0e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanSpiritGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Perspective Texture -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="columnDragon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="30%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#270e02"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="divineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="25" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hall Background Canvas -->
  <rect width="1920" height="1080" fill="url(#taijiHallAtmosphere)"/>

  <!-- Mystical Star Constellation Dome & Ceiling Vault (殿頂周天星斗與藻井) -->
  <g opacity="0.6">
    <ellipse cx="960" cy="180" rx="750" ry="160" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 12"/>
    <ellipse cx="960" cy="180" rx="550" ry="110" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="10 8"/>
    <circle cx="960" cy="180" r="80" fill="#0284c7" fill-opacity="0.1" stroke="#38bdf8" stroke-width="2"/>
    <!-- Star Points -->
    <circle cx="680" cy="150" r="3" fill="#fff" filter="url(#divineGlow)"/>
    <circle cx="790" cy="110" r="4" fill="#fde047" filter="url(#divineGlow)"/>
    <circle cx="880" cy="170" r="3" fill="#fff"/>
    <circle cx="1040" cy="160" r="4" fill="#38bdf8" filter="url(#divineGlow)"/>
    <circle cx="1150" cy="120" r="3" fill="#fff"/>
    <circle cx="1260" cy="155" r="4" fill="#fde047"/>
    <!-- Connecting Star Lines -->
    <polyline points="680,150 790,110 880,170 960,180 1040,160 1150,120 1260,155" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Central Shrine Altar & Ancient Master Statuary (大殿正中神龕與道德法座) -->
  <g transform="translate(960, 360)">
    <!-- Palace Back Wall Pillars -->
    <rect x="-350" y="-120" width="700" height="240" fill="#0b1329" stroke="#b45309" stroke-width="3"/>
    <!-- Altar Plaque (乾坤太極殿) -->
    <rect x="-150" y="-180" width="300" height="50" fill="#1e293b" stroke="#fde047" stroke-width="3" rx="4"/>
    <text x="0" y="-146" fill="#fde047" font-family="'Noto Serif TC', serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="6">乾坤太極殿</text>
    
    <!-- Imperial Throne & Divine Halo (太上法台神光) -->
    <circle cx="0" cy="-20" r="90" fill="url(#taijiGlow)" opacity="0.8"/>
    <!-- Bronze Incense Altarpiece -->
    <rect x="-120" y="40" width="240" height="70" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <!-- Incense Smoke Swirls -->
    <path d="M-60,40 C-80,0 -40,-40 -50,-90" stroke="#e2e8f0" stroke-width="3" fill="none" opacity="0.4" filter="url(#divineGlow)"/>
    <path d="M60,40 C80,0 40,-40 50,-90" stroke="#e2e8f0" stroke-width="3" fill="none" opacity="0.4" filter="url(#divineGlow)"/>
  </g>

  <!-- Great Coiled Dragon Palace Columns (金龍蟠繞重金盤龍柱) -->
  <!-- Left Outer Column -->
  <g transform="translate(160, 0)">
    <rect x="0" y="0" width="90" height="1080" fill="url(#columnDragon)" stroke="#fde047" stroke-width="2"/>
    <!-- Dragon Coils Left -->
    <path d="M0,180 Q90,260 0,340 Q90,420 0,500 Q90,580 0,660 Q90,740 0,820" stroke="#fde047" stroke-width="8" fill="none" opacity="0.85"/>
    <rect x="-15" y="880" width="120" height="200" fill="#1e293b" stroke="#ca8a04" stroke-width="3"/>
  </g>

  <!-- Left Inner Column -->
  <g transform="translate(420, 0)">
    <rect x="0" y="0" width="80" height="1080" fill="url(#columnDragon)" stroke="#fde047" stroke-width="2"/>
    <path d="M0,200 Q80,280 0,360 Q80,440 0,520 Q80,600 0,680 Q80,760 0,840" stroke="#fde047" stroke-width="6" fill="none" opacity="0.85"/>
    <rect x="-10" y="860" width="100" height="220" fill="#1e293b" stroke="#ca8a04" stroke-width="3"/>
  </g>

  <!-- Right Inner Column -->
  <g transform="translate(1420, 0)">
    <rect x="0" y="0" width="80" height="1080" fill="url(#columnDragon)" stroke="#fde047" stroke-width="2"/>
    <path d="M80,200 Q0,280 80,360 Q0,440 80,520 Q0,600 80,680 Q0,760 80,840" stroke="#fde047" stroke-width="6" fill="none" opacity="0.85"/>
    <rect x="-10" y="860" width="100" height="220" fill="#1e293b" stroke="#ca8a04" stroke-width="3"/>
  </g>

  <!-- Right Outer Column -->
  <g transform="translate(1670, 0)">
    <rect x="0" y="0" width="90" height="1080" fill="url(#columnDragon)" stroke="#fde047" stroke-width="2"/>
    <path d="M90,180 Q0,260 90,340 Q0,420 90,500 Q0,580 90,660 Q0,740 90,820" stroke="#fde047" stroke-width="8" fill="none" opacity="0.85"/>
    <rect x="-15" y="880" width="120" height="200" fill="#1e293b" stroke="#ca8a04" stroke-width="3"/>
  </g>

  <!-- Palace Floor with Perspective Grid (殿堂深邃金磚地面) -->
  <polygon points="200,480 1720,480 1920,1080 0,1080" fill="url(#floorGrad)"/>

  <!-- Perspective Floor Tile Lines -->
  <g stroke="#374151" stroke-width="1.5" opacity="0.4">
    <line x1="960" y1="480" x2="960" y2="1080"/>
    <line x1="960" y1="480" x2="720" y2="1080"/>
    <line x1="960" y1="480" x2="480" y2="1080"/>
    <line x1="960" y1="480" x2="240" y2="1080"/>
    <line x1="960" y1="480" x2="0" y2="1080"/>
    <line x1="960" y1="480" x2="1200" y2="1080"/>
    <line x1="960" y1="480" x2="1440" y2="1080"/>
    <line x1="960" y1="480" x2="1680" y2="1080"/>
    <line x1="960" y1="480" x2="1920" y2="1080"/>
  </g>

  <!-- Giant Glowing Taiji Bagua Floor Array (地面碩大陰陽太極八卦金印法陣) -->
  <g transform="translate(960, 780) scale(1, 0.45)" filter="url(#intenseGlow)">
    <!-- Outer Golden Ring -->
    <circle cx="0" cy="0" r="540" fill="none" stroke="#fde047" stroke-width="8"/>
    <circle cx="0" cy="0" r="510" fill="#0f172a" fill-opacity="0.75" stroke="#eab308" stroke-width="4"/>

    <!-- Eight Trigram Sectors (先天八卦陣位) -->
    <!-- 1. 乾 (Qian - Top) -->
    <g transform="rotate(0) translate(0, -420)">
      <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#fde047" stroke-width="8"/>
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#fde047" stroke-width="8"/>
      <line x1="-50" y1="20" x2="50" y2="20" stroke="#fde047" stroke-width="8"/>
    </g>
    <!-- 2. 坤 (Kun - Bottom) -->
    <g transform="rotate(180) translate(0, -420)">
      <line x1="-50" y1="-20" x2="-10" y2="-20" stroke="#fde047" stroke-width="8"/><line x1="10" y1="-20" x2="50" y2="-20" stroke="#fde047" stroke-width="8"/>
      <line x1="-50" y1="0" x2="-10" y2="0" stroke="#fde047" stroke-width="8"/><line x1="10" y1="0" x2="50" y2="0" stroke="#fde047" stroke-width="8"/>
      <line x1="-50" y1="20" x2="-10" y2="20" stroke="#fde047" stroke-width="8"/><line x1="10" y1="20" x2="50" y2="20" stroke="#fde047" stroke-width="8"/>
    </g>
    <!-- 3. 離 (Li - East) -->
    <g transform="rotate(90) translate(0, -420)">
      <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#fde047" stroke-width="8"/>
      <line x1="-50" y1="0" x2="-10" y2="0" stroke="#fde047" stroke-width="8"/><line x1="10" y1="0" x2="50" y2="0" stroke="#fde047" stroke-width="8"/>
      <line x1="-50" y1="20" x2="50" y2="20" stroke="#fde047" stroke-width="8"/>
    </g>
    <!-- 4. 坎 (Kan - West) -->
    <g transform="rotate(270) translate(0, -420)">
      <line x1="-50" y1="-20" x2="-10" y2="-20" stroke="#fde047" stroke-width="8"/><line x1="10" y1="-20" x2="50" y2="-20" stroke="#fde047" stroke-width="8"/>
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#fde047" stroke-width="8"/>
      <line x1="-50" y1="20" x2="-10" y2="20" stroke="#fde047" stroke-width="8"/><line x1="10" y1="20" x2="50" y2="20" stroke="#fde047" stroke-width="8"/>
    </g>
    <!-- Other 4 corners -->
    <g transform="rotate(45) translate(0, -420)"><line x1="-40" y1="-15" x2="40" y2="-15" stroke="#fde047" stroke-width="6"/><line x1="-40" y1="0" x2="40" y2="0" stroke="#fde047" stroke-width="6"/><line x1="-40" y1="15" x2="-10" y2="15" stroke="#fde047" stroke-width="6"/><line x1="10" y1="15" x2="40" y2="15" stroke="#fde047" stroke-width="6"/></g>
    <g transform="rotate(135) translate(0, -420)"><line x1="-40" y1="-15" x2="-10" y2="-15" stroke="#fde047" stroke-width="6"/><line x1="10" y1="-15" x2="40" y2="-15" stroke="#fde047" stroke-width="6"/><line x1="-40" y1="0" x2="40" y2="0" stroke="#fde047" stroke-width="6"/><line x1="-40" y1="15" x2="40" y2="15" stroke="#fde047" stroke-width="6"/></g>
    <g transform="rotate(225) translate(0, -420)"><line x1="-40" y1="-15" x2="40" y2="-15" stroke="#fde047" stroke-width="6"/><line x1="-40" y1="0" x2="-10" y2="0" stroke="#fde047" stroke-width="6"/><line x1="10" y1="0" x2="40" y2="0" stroke="#fde047" stroke-width="6"/><line x1="-40" y1="15" x2="-10" y2="15" stroke="#fde047" stroke-width="6"/><line x1="10" y1="15" x2="40" y2="15" stroke="#fde047" stroke-width="6"/></g>
    <g transform="rotate(315) translate(0, -420)"><line x1="-40" y1="-15" x2="-10" y2="-15" stroke="#fde047" stroke-width="6"/><line x1="10" y1="-15" x2="40" y2="-15" stroke="#fde047" stroke-width="6"/><line x1="-40" y1="0" x2="-10" y2="0" stroke="#fde047" stroke-width="6"/><line x1="10" y1="0" x2="40" y2="0" stroke="#fde047" stroke-width="6"/><line x1="-40" y1="15" x2="40" y2="15" stroke="#fde047" stroke-width="6"/></g>

    <!-- Central Taiji Yin-Yang Fish (黑曜石與白玉陰陽雙魚) -->
    <g transform="rotate(-30)">
      <!-- White Yang Fish -->
      <path d="M0,-300 A300,300 0 0,1 0,300 A150,150 0 0,1 0,0 A150,150 0 0,0 0,-300 Z" fill="#f8fafc" stroke="#fde047" stroke-width="4"/>
      <!-- Black Yin Fish -->
      <path d="M0,300 A300,300 0 0,1 0,-300 A150,150 0 0,1 0,0 A150,150 0 0,0 0,300 Z" fill="#090d16" stroke="#fde047" stroke-width="4"/>
      <!-- Eye Dots -->
      <circle cx="0" cy="-150" r="45" fill="#090d16" stroke="#fde047" stroke-width="3"/>
      <circle cx="0" cy="150" r="45" fill="#f8fafc" stroke="#fde047" stroke-width="3"/>
    </g>
  </g>

  <!-- Mid-air Hovering Rotating Ring of Golden Runes (空中懸浮太極符文光環) -->
  <g transform="translate(960, 520)" filter="url(#divineGlow)">
    <ellipse cx="0" cy="0" rx="360" ry="90" fill="none" stroke="#fde047" stroke-width="3" stroke-dasharray="14 10"/>
    <ellipse cx="0" cy="0" rx="390" ry="100" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6"/>
    <!-- Floating Runes & Seals -->
    <text x="-260" y="10" fill="#fde047" font-family="'Noto Serif TC', serif" font-size="20" font-weight="900">道法自然</text>
    <text x="180" y="10" fill="#38bdf8" font-family="'Noto Serif TC', serif" font-size="20" font-weight="900">乾坤借法</text>
    <text x="-40" y="-70" fill="#fde047" font-family="'Noto Serif TC', serif" font-size="18" font-weight="900">陰陽生化</text>
    <text x="-40" y="90" fill="#fff" font-family="'Noto Serif TC', serif" font-size="18" font-weight="900">太極無極</text>
  </g>

  <!-- Bronze Floor Standing Incense Cauldrons (左右青銅古鼎香爐) -->
  <g transform="translate(480, 840)" filter="url(#divineGlow)">
    <polygon points="0,0 70,0 60,80 10,80" fill="#334155" stroke="#f59e0b" stroke-width="3"/>
    <ellipse cx="35" cy="0" rx="35" ry="12" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <rect x="25" y="-30" width="20" height="30" fill="#f59e0b" opacity="0.6"/>
  </g>
  <g transform="translate(1370, 840)" filter="url(#divineGlow)">
    <polygon points="0,0 70,0 60,80 10,80" fill="#334155" stroke="#f59e0b" stroke-width="3"/>
    <ellipse cx="35" cy="0" rx="35" ry="12" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <rect x="25" y="-30" width="20" height="30" fill="#f59e0b" opacity="0.6"/>
  </g>

  <!-- Atmospheric Room Title & Seal (密室關卡標題印章) -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="340" height="90" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#ca8a04" stroke-width="2"/>
    <text x="25" y="40" fill="#fde047" font-family="'Noto Serif TC', serif" font-size="24" font-weight="900">第一重關 · 乾坤太極殿</text>
    <text x="25" y="68" fill="#94a3b8" font-family="'Noto Sans TC', sans-serif" font-size="14">密室解密 · 陰陽生化 · 八卦定乾坤</text>
  </g>
</svg>
