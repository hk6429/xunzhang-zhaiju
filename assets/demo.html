<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>尋章摘句 - 國風潑墨漫畫封神角色視覺資產圖鑑</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --border: #e2e8f0;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
      --comic-shadow: 4px 4px 0px #0f172a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 3rem;
      position: relative;
    }
    .badge-comic {
      display: inline-block;
      background: #facc15;
      color: #0f172a;
      font-weight: 900;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      border: 2px solid #0f172a;
      box-shadow: 2px 2px 0px #0f172a;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 2.4rem;
      color: #0f172a;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      font-weight: 900;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 720px;
      margin: 0 auto;
    }
    .section-title {
      font-size: 1.6rem;
      margin: 3rem 0 1.5rem;
      padding-bottom: 0.6rem;
      border-bottom: 3px solid #0f172a;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 900;
    }
    
    /* Character Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.75rem;
    }
    .char-card {
      background: var(--card-bg);
      border-radius: 1.2rem;
      border: 3px solid #0f172a;
      padding: 1.5rem;
      box-shadow: var(--comic-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .char-card:hover {
      transform: translate(-3px, -3px);
      box-shadow: 7px 7px 0px #0f172a;
    }
    .avatar-box {
      width: 200px;
      height: 200px;
      background: #f8fafc;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.2rem;
      border: 2.5px solid #0f172a;
      overflow: hidden;
      position: relative;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.25s ease;
    }
    .avatar-box:hover .avatar-img {
      transform: scale(1.05);
    }
    .char-name {
      font-size: 1.4rem;
      font-weight: 900;
      color: #0f172a;
    }
    .char-title {
      font-size: 0.88rem;
      color: #0284c7;
      font-weight: 700;
      margin-bottom: 0.6rem;
    }
    .char-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 1.2rem;
      min-height: 48px;
    }
    .mood-tabs {
      display: flex;
      gap: 0.4rem;
      width: 100%;
      margin-bottom: 1rem;
    }
    .mood-btn {
      flex: 1;
      padding: 0.4rem 0.2rem;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 0.5rem;
      border: 2px solid #0f172a;
      background: #f1f5f9;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mood-btn:hover {
      background: #e2e8f0;
    }
    .mood-btn.active {
      background: #facc15;
      color: #0f172a;
      box-shadow: 2px 2px 0px #0f172a;
      transform: translateY(-2px);
    }
    .char-quote {
      font-size: 0.85rem;
      font-style: italic;
      color: #334155;
      background: #f8fafc;
      border-left: 4px solid #facc15;
      padding: 0.6rem 0.8rem;
      border-radius: 0 0.5rem 0.5rem 0;
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
    }

    /* Group Illustrations Gallery */
    .group-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }
    .group-card {
      background: #ffffff;
      border: 3px solid #0f172a;
      border-radius: 1.2rem;
      box-shadow: var(--comic-shadow);
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .group-card:hover {
      transform: translate(-3px, -3px);
      box-shadow: 7px 7px 0px #0f172a;
    }
    .group-img-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0f172a;
      overflow: hidden;
      border-bottom: 3px solid #0f172a;
    }
    .group-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .group-card:hover .group-img {
      transform: scale(1.03);
    }
    .group-info {
      padding: 1.2rem 1.5rem;
    }
    .group-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 0.4rem;
    }
    .group-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* Items Section */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }
    .item-card {
      background: var(--card-bg);
      border-radius: 1rem;
      border: 2px solid #0f172a;
      padding: 1.2rem;
      box-shadow: 3px 3px 0px #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s;
    }
    .item-card:hover {
      transform: translateY(-3px);
    }
    .item-icon-box {
      width: 100px;
      height: 100px;
      background: #f8fafc;
      border-radius: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.8rem;
      border: 2px solid #0f172a;
    }
    .item-icon {
      width: 85%;
      height: 85%;
      object-fit: contain;
    }
    .item-name {
      font-size: 1.1rem;
      font-weight: 800;
      color: #0f172a;
    }
    .item-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0.3rem 0 0.6rem;
    }
    .badge {
      font-size: 0.72rem;
      font-weight: 900;
      padding: 0.15rem 0.5rem;
      border-radius: 0.3rem;
      border: 1.5px solid #0f172a;
    }
    .badge-ssr {
      background: #fef08a;
      color: #854d0e;
    }
    .badge-sr {
      background: #e0f2fe;
      color: #0369a1;
    }
    .item-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge-comic">⚡ 國風潑墨漫畫風格升級 ⚡</div>
      <h1>尋章摘句・封神漫畫角色資產圖鑑</h1>
      <p class="subtitle">1:1 超萌大頭身、濃黑毛筆動態勾勒 (Comic Inking)、速度線與潑墨暈染漸層、生動 4 態表情切換</p>
    </header>

    <!-- Group Illustrations Section -->
    <h2 class="section-title">🖼️ 群仙同框・大尺寸漫畫插圖特輯</h2>
    <div class="group-grid" id="group-container"></div>

    <!-- Character Roster Section -->
    <h2 class="section-title">🎎 封神 Q 版潑墨漫畫角色陣容 (8 位萌仙・4 態表情)</h2>
    <div class="grid" id="characters-container"></div>

    <!-- Items Section -->
    <h2 class="section-title">🔮 封神法寶與密室道具圖鑑</h2>
    <div class="items-grid" id="items-container"></div>
  </div>

  <script type="module">
    import { CHARACTERS, GROUP_ILLUSTRATIONS } from './characters/character-registry.js';
    import { ITEMS } from './items/items-registry.js';

    // Render Group Illustrations
    const groupContainer = document.getElementById('group-container');
    if (GROUP_ILLUSTRATIONS && GROUP_ILLUSTRATIONS.length > 0) {
      GROUP_ILLUSTRATIONS.forEach(group => {
        const card = document.createElement('div');
        card.className = 'group-card';
        card.innerHTML = `
          <div class="group-img-box">
            <img src="${group.imagePath || group.svgPath}" alt="${group.title}" class="group-img">
          </div>
          <div class="group-info">
            <div class="group-title">${group.title}</div>
            <div class="group-desc">${group.desc}</div>
          </div>
        `;
        groupContainer.appendChild(card);
      });
    }

    // Render Characters
    const charContainer = document.getElementById('characters-container');
    CHARACTERS.forEach(char => {
      const card = document.createElement('div');
      card.className = 'char-card';
      card.innerHTML = `
        <div class="avatar-box" id="box-${char.id}">
          <img src="${char.expressions.idle}" alt="${char.name}" class="avatar-img" id="img-${char.id}">
        </div>
        <div class="char-name">${char.name}</div>
        <div class="char-title">${char.title}</div>
        <div class="char-desc">${char.desc}</div>
        <div class="mood-tabs">
          <button class="mood-btn active" data-char="${char.id}" data-mood="idle">待機</button>
          <button class="mood-btn" data-char="${char.id}" data-mood="thinking">沉思</button>
          <button class="mood-btn" data-char="${char.id}" data-mood="victory">破陣</button>
          <button class="mood-btn" data-char="${char.id}" data-mood="panic">驚慌</button>
        </div>
        <div class="char-quote" id="quote-${char.id}">${char.quotes.idle}</div>
      `;
      charContainer.appendChild(card);
    });

    // Mood Tab Click Handler
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('mood-btn')) {
        const btn = e.target;
        const charId = btn.getAttribute('data-char');
        const mood = btn.getAttribute('data-mood');
        const char = CHARACTERS.find(c => c.id === charId);

        // Update active class
        btn.parentElement.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Update image & quote
        const img = document.getElementById(`img-${charId}`);
        const quote = document.getElementById(`quote-${charId}`);
        if (img && char) {
          img.src = char.expressions[mood];
        }
        if (quote && char) {
          quote.innerText = char.quotes[mood];
        }
      }
    });

    // Render Items
    const itemsContainer = document.getElementById('items-container');
    if (ITEMS && ITEMS.length > 0) {
      ITEMS.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        const badgeClass = item.rarity === 'SSR' ? 'badge-ssr' : 'badge-sr';
        card.innerHTML = `
          <div class="item-icon-box">
            <img src="${item.imagePath || item.svgPath}" alt="${item.name}" class="item-icon">
          </div>
          <div class="item-name">${item.name}</div>
          <div class="item-meta">
            <span class="badge ${badgeClass}">${item.rarity}</span>
            <span style="font-size:0.75rem; color:#64748b;">${item.owner}</span>
          </div>
          <div class="item-desc">${item.desc}</div>
        `;
        itemsContainer.appendChild(card);
      });
    }
  </script>
</body>
</html>
