<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="ink-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.18" />
    </filter>
    <linearGradient id="skin-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <radialGradient id="blush-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ink-drop-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <g id="moling-thinking">
    <!-- Floating Ink Cloud Base -->
    <ellipse cx="120" cy="220" rx="36" ry="9" fill="#0f172a" opacity="0.15"/>
    <path d="M 80 220 Q 95 210 115 218 Q 135 208 160 220 Q 140 228 120 225 Q 95 228 80 220 Z" fill="#e0f2fe" opacity="0.8"/>

    <!-- Robe Body -->
    <path d="M 90 148 L 72 212 C 72 216 168 216 168 212 L 150 148 Z" fill="url(#robe-grad)" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round" filter="url(#ink-shadow)"/>
    <path d="M 96 148 L 120 180 L 144 148" fill="#f8fafc" stroke="#0f172a" stroke-width="3.5"/>
    <path d="M 78 184 Q 120 192 162 184" stroke="#facc15" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <circle cx="120" cy="186" r="6" fill="#ef4444" stroke="#0f172a" stroke-width="2"/>

    <!-- Small Feet -->
    <ellipse cx="102" cy="214" rx="8" ry="4.5" fill="#0f172a"/>
    <ellipse cx="138" cy="214" rx="8" ry="4.5" fill="#0f172a"/>

    <!-- Left Hand touching chin in thought -->
    <path d="M 90 156 Q 74 135 88 120" stroke="#0f172a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="88" cy="120" r="6.5" fill="#fed7aa" stroke="#0f172a" stroke-width="2.5"/>

    <!-- Right Hand holding brush pointing up -->
    <path d="M 150 156 Q 168 150 172 135" stroke="#0f172a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="172" cy="135" r="6.5" fill="#fed7aa" stroke="#0f172a" stroke-width="2.5"/>
    <g transform="rotate(-15 172 135)">
      <rect x="170" y="60" width="7" height="90" rx="3.5" fill="#b45309" stroke="#0f172a" stroke-width="2.5"/>
      <rect x="168" y="56" width="11" height="8" rx="2" fill="#facc15" stroke="#0f172a" stroke-width="1.5"/>
      <path d="M 168 56 Q 173 28 173.5 25 Q 174 28 179 56 Z" fill="url(#ink-drop-grad)" stroke="#0f172a" stroke-width="2"/>
    </g>

    <!-- Chibi Head (slightly tilted) -->
    <g transform="rotate(4 120 100)">
      <ellipse cx="120" cy="98" rx="46" ry="42" fill="url(#skin-grad)" stroke="#0f172a" stroke-width="4.5" filter="url(#ink-shadow)"/>
      <ellipse cx="86" cy="106" rx="9" ry="5.5" fill="url(#blush-grad)"/>
      <ellipse cx="154" cy="106" rx="9" ry="5.5" fill="url(#blush-grad)"/>

      <!-- Forehead Inkdrop Mark -->
      <path d="M 120 74 C 117 78 115 82 115 84 C 115 87 117.2 89 120 89 C 122.8 89 125 87 125 84 C 125 82 123 78 120 74 Z" fill="#0284c7"/>

      <!-- Thinking Brows & Eyes (Looking up/puzzled) -->
      <path d="M 94 85 Q 102 88 110 84" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 130 84 Q 138 81 146 86" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>

      <ellipse cx="102" cy="96" rx="6.5" ry="7.5" fill="#0f172a"/>
      <circle cx="104" cy="93" r="2.5" fill="#ffffff"/>
      <ellipse cx="138" cy="96" rx="6.5" ry="7.5" fill="#0f172a"/>
      <circle cx="140" cy="93" r="2.5" fill="#ffffff"/>

      <!-- Mouth (Small 'o' of pondering) -->
      <ellipse cx="120" cy="114" rx="3.5" ry="4.5" fill="#0f172a"/>

      <!-- Hair & Buns -->
      <path d="M 74 96 C 68 65 96 46 120 46 C 144 46 172 65 166 96 C 158 76 142 58 120 58 C 98 58 82 76 74 96 Z" fill="#0f172a"/>
      <path d="M 94 62 Q 106 78 120 62 Q 134 78 146 62" fill="#0f172a"/>
      <circle cx="92" cy="42" r="14" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
      <circle cx="148" cy="42" r="14" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
      <path d="M 82 46 Q 74 54 78 64" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 158 46 Q 166 54 162 64" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="92" cy="48" r="4" fill="#facc15"/>
      <circle cx="148" cy="48" r="4" fill="#facc15"/>
    </g>

    <!-- Thinking Sparkles / Question marks -->
    <text x="180" y="70" font-size="24" font-weight="bold" fill="#0284c7" font-family="sans-serif">？</text>
    <path d="M 55 70 L 60 78 L 68 80 L 60 82 L 55 90 L 50 82 L 42 80 L 50 78 Z" fill="#facc15"/>
  </g>
</svg>
