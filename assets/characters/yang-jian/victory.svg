<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <filter id="comic-shadow-yj" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="0" flood-color="#0f172a" flood-opacity="0.8" />
    </filter>
    <filter id="glow-celestial-yj" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="blade-grad-yj" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="skin-yj" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <!-- Epic Action Radial Lines -->
  <g stroke="#0284c7" stroke-width="2.5" opacity="0.6" stroke-linecap="round">
    <line x1="140" y1="140" x2="20" y2="20"/>
    <line x1="140" y1="140" x2="80" y2="10"/>
    <line x1="140" y1="140" x2="200" y2="10"/>
    <line x1="140" y1="140" x2="260" y2="25"/>
    <line x1="140" y1="140" x2="270" y2="90"/>
    <line x1="140" y1="140" x2="265" y2="170"/>
    <line x1="140" y1="140" x2="260" y2="240"/>
    <line x1="140" y1="140" x2="20" y2="240"/>
    <line x1="140" y1="140" x2="10" y2="150"/>
  </g>

  <!-- Divine Blade Slash Arc (巨大斬擊水墨弧光) -->
  <path d="M 30 180 C 40 40 240 20 260 90" fill="none" stroke="url(#blade-grad-yj)" stroke-width="14" stroke-linecap="round" filter="url(#glow-celestial-yj)"/>
  <path d="M 30 180 C 40 40 240 20 260 90" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Three-pointed Blade held in Two Hands Slash Pose -->
  <g id="spear-slash" filter="url(#comic-shadow-yj)">
    <line x1="45" y1="210" x2="245" y2="45" stroke="#ca8a04" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(245, 45) rotate(45)" filter="url(#glow-celestial-yj)">
      <path d="M 0 -24 L 9 0 L -9 0 Z" fill="url(#blade-grad-yj)" stroke="#0f172a" stroke-width="2.5"/>
      <path d="M -9 0 Q -20 -8 -18 -20 Q -10 -10 -4 -4 Z" fill="url(#blade-grad-yj)" stroke="#0f172a" stroke-width="2"/>
      <path d="M 9 0 Q 20 -8 18 -20 Q 10 -10 4 -4 Z" fill="url(#blade-grad-yj)" stroke="#0f172a" stroke-width="2"/>
    </g>
  </g>

  <!-- Body (Dynamic Stance) -->
  <g id="body" filter="url(#comic-shadow-yj)">
    <path d="M 105 205 L 85 245 L 125 245 L 140 220 L 155 245 L 195 245 L 175 205 Z" fill="#1e293b" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 105 160 L 90 210 Q 140 220 190 210 L 175 160 Z" fill="#0284c7" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>
    <circle cx="140" cy="185" r="9" fill="#facc15" stroke="#0f172a" stroke-width="2.5"/>
  </g>

  <!-- Arms Slashing Sword -->
  <g id="arms" filter="url(#comic-shadow-yj)">
    <path d="M 105 165 Q 125 150 150 140" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 105 165 Q 125 150 150 140" stroke="#bae6fd" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="150" cy="140" r="7.5" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
  </g>

  <!-- Xiaotian Dog Wearing Sunglasses Leaping Joyfully! -->
  <g id="xiaotian-dog" transform="translate(60, 195)" filter="url(#comic-shadow-yj)">
    <ellipse cx="0" cy="8" rx="15" ry="11" fill="#0f172a"/>
    <circle cx="6" cy="-4" r="13" fill="#0f172a"/>
    <ellipse cx="8" cy="-2" rx="9" ry="8" fill="#ffffff"/>
    <polygon points="-2,-14 2,-24 8,-12" fill="#0f172a"/>
    <polygon points="6,-12 12,-24 16,-14" fill="#0f172a"/>
    <!-- Sunglasses (墨鏡) -->
    <rect x="-1" y="-8" width="16" height="7" rx="2" fill="#0f172a" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="7" y1="-8" x2="7" y2="-1" stroke="#ca8a04" stroke-width="1.5"/>
    <!-- Paws high in air -->
    <circle cx="-8" cy="-8" r="4" fill="#fed7aa" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="18" cy="-8" r="4" fill="#fed7aa" stroke="#0f172a" stroke-width="1.5"/>
  </g>

  <!-- Head Base -->
  <g id="hair-back" filter="url(#comic-shadow-yj)">
    <ellipse cx="140" cy="100" rx="56" ry="52" fill="#0f172a" stroke="#0f172a" stroke-width="4"/>
    <path d="M 140 50 C 180 20 220 50 215 95 C 195 70 170 60 140 60 Z" fill="#0f172a" stroke="#0f172a" stroke-width="3"/>
    <path d="M 125 48 L 155 48 L 140 32 Z" fill="#facc15" stroke="#0f172a" stroke-width="2.5"/>
  </g>

  <!-- Chibi Face -->
  <ellipse cx="140" cy="112" rx="48" ry="42" fill="url(#skin-yj)" stroke="#0f172a" stroke-width="4.5" filter="url(#comic-shadow-yj)"/>

  <!-- Celestial Third Eye Gleaming Bright -->
  <g transform="translate(140, 84)" filter="url(#glow-celestial-yj)">
    <path d="M -9 0 Q 0 -7 9 0 Q 0 7 -9 0 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="0" cy="0" r="3.5" fill="#facc15"/>
  </g>

  <!-- Bangs -->
  <path d="M 94 88 Q 110 106 122 92 L 140 100 L 158 92 Q 170 106 186 88 Q 140 68 94 88 Z" fill="#0f172a"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="102" cy="122" rx="9" ry="5" fill="#fb7185" opacity="0.6"/>
  <ellipse cx="178" cy="122" rx="9" ry="5" fill="#fb7185" opacity="0.6"/>

  <!-- Confident Victory Eyes (Sharp smiling curves) -->
  <g id="eyes">
    <path d="M 106 108 Q 118 96 130 108" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 150 108 Q 162 96 174 108" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Victorious Confident Smile -->
  <g id="mouth">
    <path d="M 130 125 Q 140 138 150 125" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="#e11d48"/>
  </g>
</svg>
