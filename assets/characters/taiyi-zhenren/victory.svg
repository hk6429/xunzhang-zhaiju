<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <filter id="comic-shadow-ty" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="0" flood-color="#0f172a" flood-opacity="0.8" />
    </filter>
    <filter id="glow-fire-ty" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="fire-grad-ty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="robe-grad-ty" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="skin-ty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <!-- Golden & Red Action Radial Lines -->
  <g stroke="#f59e0b" stroke-width="2.5" opacity="0.6" stroke-linecap="round">
    <line x1="140" y1="140" x2="20" y2="20"/>
    <line x1="140" y1="140" x2="80" y2="10"/>
    <line x1="140" y1="140" x2="200" y2="10"/>
    <line x1="140" y1="140" x2="260" y2="25"/>
    <line x1="140" y1="140" x2="270" y2="90"/>
    <line x1="140" y1="140" x2="260" y2="240"/>
    <line x1="140" y1="140" x2="20" y2="240"/>
  </g>

  <!-- Nine-Dragon Divine Fire Cover (九龍神火罩) Floating in Center Top -->
  <g transform="translate(140, 40)" filter="url(#glow-fire-ty)">
    <!-- Bell Cover -->
    <path d="M -22 15 Q 0 -15 22 15 Z" fill="url(#fire-grad-ty)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="0" cy="-10" r="5" fill="#facc15" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Mini Fire Dragons Spiraling (9 mini flame sparks) -->
    <circle cx="-35" cy="5" r="4" fill="#f97316"/>
    <circle cx="35" cy="5" r="4" fill="#f97316"/>
    <circle cx="-25" cy="-20" r="3.5" fill="#fde047"/>
    <circle cx="25" cy="-20" r="3.5" fill="#fde047"/>
    <circle cx="0" cy="28" r="4.5" fill="#ef4444"/>
  </g>

  <!-- Chubby Body (Shaking with Laughter) -->
  <g id="body" filter="url(#comic-shadow-ty)">
    <ellipse cx="140" cy="205" rx="55" ry="40" fill="url(#robe-grad-ty)" stroke="#0f172a" stroke-width="4.5"/>
    <path d="M 92 215 Q 140 235 188 215" stroke="#dc2626" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="140" cy="225" r="8" fill="#facc15" stroke="#0f172a" stroke-width="2.5"/>
    <ellipse cx="110" cy="242" rx="14" ry="7" fill="#0f172a" transform="rotate(-8 110 242)"/>
    <ellipse cx="170" cy="242" rx="14" ry="7" fill="#0f172a" transform="rotate(8 170 242)"/>
  </g>

  <!-- Arms Raised in Jubilant Laughter -->
  <g id="arms" filter="url(#comic-shadow-ty)">
    <path d="M 95 180 Q 70 140 85 105" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 95 180 Q 70 140 85 105" stroke="#fde68a" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="85" cy="105" r="7.5" fill="#fed7aa" stroke="#0f172a" stroke-width="2.5"/>

    <path d="M 185 180 Q 210 140 195 105" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 185 180 Q 210 140 195 105" stroke="#fde68a" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="195" cy="105" r="7.5" fill="#fed7aa" stroke="#0f172a" stroke-width="2.5"/>
  </g>

  <!-- Head Base -->
  <g id="hair-back" filter="url(#comic-shadow-ty)">
    <ellipse cx="140" cy="105" rx="60" ry="54" fill="#0f172a" stroke="#0f172a" stroke-width="4"/>
    <path d="M 125 50 L 155 50 L 150 28 L 130 28 Z" fill="#facc15" stroke="#0f172a" stroke-width="3"/>
  </g>

  <!-- Round Face -->
  <ellipse cx="140" cy="115" rx="52" ry="46" fill="url(#skin-ty)" stroke="#0f172a" stroke-width="4.5" filter="url(#comic-shadow-ty)"/>

  <!-- Big Red Rosy Cheeks -->
  <ellipse cx="96" cy="122" rx="12" ry="8" fill="#fb7185" opacity="0.85"/>
  <ellipse cx="184" cy="122" rx="12" ry="8" fill="#fb7185" opacity="0.85"/>

  <!-- Joyful Curved Laughing Eyes (^^) -->
  <g id="eyes">
    <path d="M 106 108 Q 118 92 130 108" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <path d="M 150 108 Q 162 92 174 108" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  </g>

  <path d="M 102 86 Q 118 78 130 86" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 178 86 Q 162 78 150 86" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>

  <circle cx="140" cy="116" r="5" fill="#f97316" stroke="#0f172a" stroke-width="2"/>

  <!-- Giant Open Laughing Mouth ("哈哈！大吉！") -->
  <g id="mouth">
    <path d="M 122 124 Q 140 114 158 124 Q 140 155 122 124 Z" fill="#e11d48" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 128 138 Q 140 130 152 138" fill="#fda4af"/>
  </g>
</svg>
