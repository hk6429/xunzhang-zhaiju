<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <filter id="comic-shadow-dj" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="0" flood-color="#0f172a" flood-opacity="0.8" />
    </filter>
    <filter id="glow-foxfire-dj" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="tail-grad-dj" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="60%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="silk-grad-dj" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="skin-dj" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <!-- Fireworks & Pink Speedlines -->
  <g stroke="#f43f5e" stroke-width="2.5" opacity="0.6" stroke-linecap="round">
    <line x1="140" y1="140" x2="20" y2="20"/>
    <line x1="140" y1="140" x2="80" y2="10"/>
    <line x1="140" y1="140" x2="200" y2="10"/>
    <line x1="140" y1="140" x2="260" y2="25"/>
    <line x1="140" y1="140" x2="270" y2="90"/>
    <line x1="140" y1="140" x2="260" y2="240"/>
    <line x1="140" y1="140" x2="20" y2="240"/>
  </g>

  <!-- Nine Glorious Fan-shaped Tails -->
  <g id="nine-tails" filter="url(#comic-shadow-dj)">
    <path d="M 120 180 C 50 180 10 140 10 100 C 25 90 55 120 110 170 Z" fill="url(#tail-grad-dj)" stroke="#0f172a" stroke-width="3"/>
    <path d="M 120 180 C 50 150 20 100 25 60 C 45 60 70 95 115 165 Z" fill="url(#tail-grad-dj)" stroke="#0f172a" stroke-width="3"/>
    <path d="M 125 180 C 70 130 50 70 65 30 C 85 40 105 80 125 160 Z" fill="url(#tail-grad-dj)" stroke="#0f172a" stroke-width="3"/>
    <path d="M 130 175 C 90 110 95 40 115 10 C 130 25 130 70 135 155 Z" fill="url(#tail-grad-dj)" stroke="#0f172a" stroke-width="3"/>
    <path d="M 150 175 C 190 110 185 40 165 10 C 150 25 150 70 145 155 Z" fill="url(#tail-grad-dj)" stroke="#0f172a" stroke-width="3"/>
    <path d="M 155 180 C 210 130 230 70 215 30 C 195 40 175 80 155 160 Z" fill="url(#tail-grad-dj)" stroke="#0f172a" stroke-width="3"/>
    <path d="M 160 180 C 230 150 260 100 255 60 C 235 60 210 95 165 165 Z" fill="url(#tail-grad-dj)" stroke="#0f172a" stroke-width="3"/>
    <path d="M 160 180 C 230 180 270 140 270 100 C 255 90 225 120 170 170 Z" fill="url(#tail-grad-dj)" stroke="#0f172a" stroke-width="3"/>
  </g>

  <!-- Floating Glowing Hearts (心心相印) -->
  <g filter="url(#glow-foxfire-dj)">
    <path d="M 45 65 C 45 55 35 50 28 58 C 21 50 11 55 11 65 C 11 78 28 88 28 88 C 28 88 45 78 45 65 Z" fill="#ec4899"/>
    <path d="M 265 65 C 265 55 255 50 248 58 C 241 50 231 55 231 65 C 231 78 248 88 248 88 C 248 88 265 78 265 65 Z" fill="#ec4899"/>
  </g>

  <!-- Body -->
  <g id="body" filter="url(#comic-shadow-dj)">
    <path d="M 105 165 L 80 235 Q 140 250 200 235 L 175 165 Z" fill="url(#silk-grad-dj)" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 95 190 Q 140 205 185 190 L 180 205 Q 140 220 100 205 Z" fill="#db2777" stroke="#0f172a" stroke-width="3.5"/>
    <circle cx="140" cy="200" r="7" fill="#facc15" stroke="#0f172a" stroke-width="2"/>
    <ellipse cx="115" cy="242" rx="12" ry="6" fill="#0f172a"/>
    <ellipse cx="165" cy="242" rx="12" ry="6" fill="#0f172a"/>
  </g>

  <!-- Arms: Double Finger-Heart / Cheering pose -->
  <g id="arms" filter="url(#comic-shadow-dj)">
    <!-- Left Arm -->
    <path d="M 100 170 Q 75 145 85 125" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 100 170 Q 75 145 85 125" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="85" cy="125" r="7" fill="#fed7aa" stroke="#0f172a" stroke-width="2.5"/>

    <!-- Right Arm -->
    <path d="M 175 170 Q 200 145 190 125" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 175 170 Q 200 145 190 125" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="190" cy="125" r="7" fill="#fed7aa" stroke="#0f172a" stroke-width="2.5"/>
  </g>

  <!-- Head Base -->
  <g id="hair-back" filter="url(#comic-shadow-dj)">
    <ellipse cx="140" cy="100" rx="56" ry="52" fill="#0f172a" stroke="#0f172a" stroke-width="4"/>
    <g transform="translate(90, 50) rotate(-20)">
      <polygon points="0,15 -18,-28 12,-8" fill="#0f172a" stroke="#0f172a" stroke-width="4"/>
      <polygon points="0,10 -14,-22 8,-6" fill="#f43f5e"/>
    </g>
    <g transform="translate(190, 50) rotate(20)">
      <polygon points="0,15 18,-28 -12,-8" fill="#0f172a" stroke="#0f172a" stroke-width="4"/>
      <polygon points="0,10 14,-22 -8,-6" fill="#f43f5e"/>
    </g>
  </g>

  <!-- Chibi Face -->
  <ellipse cx="140" cy="112" rx="48" ry="42" fill="url(#skin-dj)" stroke="#0f172a" stroke-width="4.5" filter="url(#comic-shadow-dj)"/>

  <!-- Bangs -->
  <path d="M 94 90 Q 112 108 125 94 Q 140 108 155 94 Q 168 108 186 90 Q 140 70 94 90 Z" fill="#0f172a"/>

  <!-- Deep Pink Blushing Cheeks -->
  <ellipse cx="100" cy="122" rx="12" ry="7" fill="#fb7185" opacity="0.85"/>
  <ellipse cx="180" cy="122" rx="12" ry="7" fill="#fb7185" opacity="0.85"/>

  <!-- Comic Heart Eyes (❤❤ 心心眼！) -->
  <g id="heart-eyes" filter="url(#glow-foxfire-dj)">
    <!-- Left Heart Eye -->
    <path d="M 126 110 C 126 102 118 98 112 104 C 106 98 98 102 98 110 C 98 120 112 128 112 128 C 112 128 126 120 126 110 Z" fill="#f43f5e" stroke="#0f172a" stroke-width="2"/>
    <!-- Right Heart Eye -->
    <path d="M 176 110 C 176 102 168 98 162 104 C 156 98 148 102 148 110 C 148 120 162 128 162 128 C 162 128 176 120 176 110 Z" fill="#f43f5e" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Laughing Mouth -->
  <g id="mouth">
    <path d="M 126 125 Q 140 116 154 125 Q 140 148 126 125 Z" fill="#e11d48" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 132 136 Q 140 130 148 136" fill="#fda4af"/>
  </g>
</svg>
