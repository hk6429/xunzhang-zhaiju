<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <filter id="comic-shadow-sg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="0" flood-color="#0f172a" flood-opacity="0.8" />
    </filter>
    <linearGradient id="purple-robe-sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="skin-sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <!-- Comic Panic Lines -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.4">
    <line x1="40" y1="20" x2="40" y2="80"/>
    <line x1="240" y1="20" x2="240" y2="80"/>
  </g>

  <!-- Panicked Fat Tiger Sprinting with Dust Clouds (四腳朝天狂奔) -->
  <g id="spotted-tiger" transform="translate(190, 205)" filter="url(#comic-shadow-sg)">
    <ellipse cx="0" cy="10" rx="28" ry="18" fill="#facc15" stroke="#0f172a" stroke-width="3.5"/>
    <ellipse cx="-10" cy="5" rx="5" ry="3" fill="#0f172a"/>
    <circle cx="15" cy="-2" r="14" fill="#facc15" stroke="#0f172a" stroke-width="3"/>
    <!-- Panicked Tiger Eyes (><) -->
    <path d="M 8 -5 L 14 -1 M 8 3 L 14 -1" stroke="#0f172a" stroke-width="2"/>
    <path d="M 18 -5 L 24 -1 M 18 3 L 24 -1" stroke="#0f172a" stroke-width="2"/>
    <!-- Tiger Waterfall Tears -->
    <path d="M 12 1 Q 14 18 16 30" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <path d="M 22 1 Q 24 18 26 30" stroke="#38bdf8" stroke-width="3" fill="none"/>
  </g>
  <!-- Running Smoke Puffs -->
  <circle cx="90" cy="245" r="10" fill="#e2e8f0" opacity="0.8"/>
  <circle cx="65" cy="250" r="7" fill="#e2e8f0" opacity="0.8"/>

  <!-- Body (Clinging on in terror) -->
  <g id="body" filter="url(#comic-shadow-sg)">
    <path d="M 105 165 L 80 240 Q 140 255 200 240 L 175 165 Z" fill="url(#purple-robe-sg)" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 98 195 Q 140 205 182 195 L 180 210 Q 140 220 100 210 Z" fill="#eab308" stroke="#0f172a" stroke-width="3.5"/>
    <ellipse cx="115" cy="245" rx="14" ry="7" fill="#0f172a"/>
    <ellipse cx="165" cy="245" rx="14" ry="7" fill="#0f172a"/>
  </g>

  <!-- Flailing Arms (Hands grabbing head in terror) -->
  <g id="arms" filter="url(#comic-shadow-sg)">
    <path d="M 100 175 Q 60 140 85 95" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 100 175 Q 60 140 85 95" stroke="#a855f7" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="85" cy="95" r="9" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>

    <path d="M 180 175 Q 220 140 195 95" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 180 175 Q 220 140 195 95" stroke="#a855f7" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="195" cy="95" r="9" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
  </g>

  <!-- Head Base -->
  <g id="hair-back" filter="url(#comic-shadow-sg)">
    <ellipse cx="140" cy="105" rx="58" ry="52" fill="#0f172a" stroke="#0f172a" stroke-width="4"/>
    <!-- Crooked Cap Flying off slightly -->
    <g transform="translate(140, 35) rotate(-20)">
      <path d="M -15 20 L -20 -15 L 20 -15 L 15 20 Z" fill="#6b21a8" stroke="#0f172a" stroke-width="3.5"/>
    </g>
  </g>

  <!-- Chibi Face -->
  <ellipse cx="140" cy="115" rx="50" ry="44" fill="url(#skin-sg)" stroke="#0f172a" stroke-width="4.5" filter="url(#comic-shadow-sg)"/>

  <!-- Giant Comic Sweat Drops -->
  <g filter="url(#comic-shadow-sg)">
    <path d="M 65 75 Q 55 95 70 100 Q 80 95 72 75 Z" fill="#38bdf8" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M 215 75 Q 225 95 210 100 Q 200 95 208 75 Z" fill="#38bdf8" stroke="#0f172a" stroke-width="2.5"/>
  </g>

  <!-- Comic Popped Out Eyeballs (漫畫爆凸眼球！) -->
  <g id="popped-eyes" filter="url(#comic-shadow-sg)">
    <!-- Left Eye stalk -->
    <ellipse cx="114" cy="104" rx="14" ry="14" fill="#ffffff" stroke="#0f172a" stroke-width="3.5"/>
    <circle cx="114" cy="104" r="5" fill="#0f172a"/>
    <circle cx="112" cy="102" r="2" fill="#ffffff"/>
    <!-- Right Eye stalk -->
    <ellipse cx="166" cy="104" rx="14" ry="14" fill="#ffffff" stroke="#0f172a" stroke-width="3.5"/>
    <circle cx="166" cy="104" r="5" fill="#0f172a"/>
    <circle cx="164" cy="102" r="2" fill="#ffffff"/>
  </g>

  <!-- Panic Eyebrows -->
  <path d="M 100 82 Q 115 94 128 84" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M 152 84 Q 165 94 180 82" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Shaking Mustache (Trembling八字鬍) -->
  <g id="mustache" filter="url(#comic-shadow-sg)">
    <path d="M 138 126 Q 110 135 90 148 Q 115 140 136 130 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M 142 126 Q 170 135 190 148 Q 165 140 144 130 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5"/>
  </g>

  <!-- Wide Open Screaming O-Mouth with Wavy Teeth -->
  <g id="mouth">
    <ellipse cx="140" cy="138" rx="18" ry="15" fill="#7e22ce" stroke="#0f172a" stroke-width="3.5"/>
    <path d="M 128 128 Q 140 134 152 128" stroke="#ffffff" stroke-width="3.5" fill="none"/>
  </g>
</svg>
