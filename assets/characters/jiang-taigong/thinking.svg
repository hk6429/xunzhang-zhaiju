<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <pattern id="halftone-jt-think" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#0284c7" opacity="0.2"/>
    </pattern>
    <filter id="comic-shadow-jt" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="0" flood-color="#0f172a" flood-opacity="0.8" />
    </filter>
    <filter id="glow-gold-jt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="robe-grad-jt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="skin-jt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <!-- Thinking Aura -->
  <circle cx="140" cy="140" r="125" fill="#f0f9ff" opacity="0.5"/>
  <circle cx="140" cy="140" r="115" fill="url(#halftone-jt-think)" />

  <!-- Comic Calculation & Bagua Ring in Background -->
  <g transform="translate(210, 60)" filter="url(#glow-gold-jt)">
    <circle cx="0" cy="0" r="28" fill="#fef08a" stroke="#ca8a04" stroke-width="3" stroke-dasharray="4 2"/>
    <!-- Taiji Bagua Lines -->
    <text x="0" y="8" font-family="'Noto Serif TC', serif" font-weight="900" font-size="28" fill="#ca8a04" text-anchor="middle">？</text>
    <!-- Little Bagua trigram lines -->
    <line x1="-12" y1="-18" x2="12" y2="-18" stroke="#ca8a04" stroke-width="2.5"/>
    <line x1="-12" y1="-22" x2="12" y2="-22" stroke="#ca8a04" stroke-width="2.5"/>
    <line x1="-12" y1="20" x2="12" y2="20" stroke="#ca8a04" stroke-width="2.5"/>
  </g>

  <!-- Comic Ink Splatters -->
  <circle cx="45" cy="55" r="4" fill="#0f172a" opacity="0.6"/>
  <circle cx="35" cy="70" r="2.5" fill="#0f172a" opacity="0.4"/>
  <ellipse cx="140" cy="245" rx="75" ry="14" fill="#0f172a" opacity="0.2"/>

  <!-- Apricot Flag in Background -->
  <g id="apricot-flag" filter="url(#comic-shadow-jt)">
    <path d="M 60 80 L 60 230" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <circle cx="60" cy="75" r="6" fill="#facc15" stroke="#0f172a" stroke-width="2"/>
    <path d="M 60 85 Q 15 105 55 145 Z" fill="#facc15" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- Body -->
  <g id="body" filter="url(#comic-shadow-jt)">
    <path d="M 105 165 L 80 240 Q 140 255 200 240 L 175 165 Z" fill="url(#robe-grad-jt)" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 98 195 Q 140 205 182 195 L 180 210 Q 140 220 100 210 Z" fill="#0284c7" stroke="#0f172a" stroke-width="3.5"/>
    <circle cx="140" cy="204" r="8" fill="#facc15" stroke="#0f172a" stroke-width="2.5"/>
    <ellipse cx="115" cy="245" rx="14" ry="7" fill="#0f172a"/>
    <ellipse cx="165" cy="245" rx="14" ry="7" fill="#0f172a"/>
  </g>

  <!-- Arms (One scratching beard in deep thought, other pinching fingers to calculate) -->
  <g id="arms" filter="url(#comic-shadow-jt)">
    <!-- Right Arm Pinching Hexagram -->
    <path d="M 175 175 Q 195 160 185 140" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 175 175 Q 195 160 185 140" stroke="#bae6fd" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="185" cy="138" r="8" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
    <!-- Pinching fingers -->
    <path d="M 183 133 Q 190 128 193 135" stroke="#0f172a" stroke-width="2.5" fill="none"/>

    <!-- Left Arm Stroking Long Beard -->
    <path d="M 100 175 Q 120 190 135 175" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 100 175 Q 120 190 135 175" stroke="#bae6fd" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="138" cy="172" r="8" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
  </g>

  <!-- Hair Base (Back) -->
  <g id="hair-back" filter="url(#comic-shadow-jt)">
    <ellipse cx="140" cy="105" rx="60" ry="55" fill="#f8fafc" stroke="#0f172a" stroke-width="4.5"/>
    <path d="M 78 120 C 60 160 85 190 100 185" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
    <path d="M 202 120 C 220 160 195 190 180 185" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
  </g>

  <!-- Sage Crown -->
  <g id="topknot" filter="url(#comic-shadow-jt)">
    <ellipse cx="140" cy="50" rx="20" ry="16" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
    <path d="M 125 54 Q 140 32 155 54 Z" fill="#0284c7" stroke="#0f172a" stroke-width="3.5"/>
    <path d="M 115 50 L 165 46" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Head & Face -->
  <ellipse cx="140" cy="115" rx="50" ry="44" fill="url(#skin-jt)" stroke="#0f172a" stroke-width="4.5" filter="url(#comic-shadow-jt)"/>

  <!-- Comic Sweat Drop -->
  <path d="M 85 92 Q 80 105 88 108 Q 94 105 90 92 Z" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>

  <!-- Comic Thinking Eyes (Looking Up & Sideways) -->
  <g id="eyes">
    <ellipse cx="118" cy="106" rx="9" ry="10" fill="#0f172a"/>
    <circle cx="122" cy="102" r="4" fill="#ffffff"/>
    <ellipse cx="162" cy="106" rx="9" ry="10" fill="#0f172a"/>
    <circle cx="166" cy="102" r="4" fill="#ffffff"/>
  </g>

  <!-- Asymmetric Thinking Brows -->
  <path d="M 102 92 Q 115 98 128 92" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 152 90 Q 165 82 178 88" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Mouth (Wavy 'Hmm' Mouth) -->
  <path d="M 132 128 Q 138 124 144 128 Q 148 132 152 127" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Long Beard with Tilt to Side -->
  <g id="beard" filter="url(#comic-shadow-jt)">
    <path d="M 138 128 Q 118 135 105 142 Q 125 144 138 133 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
    <path d="M 142 128 Q 162 135 175 142 Q 155 144 142 133 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
    <!-- Swerved Beard (stroked) -->
    <path d="M 120 135 C 110 165 140 210 155 218 C 170 205 175 165 160 135 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
    <path d="M 135 150 Q 145 185 152 208" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
