<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <filter id="comic-shadow-nz" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="0" flood-color="#0f172a" flood-opacity="0.8" />
    </filter>
    <filter id="glow-flame-nz" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="fire-grad-nz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="ribbon-grad-nz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="skin-nz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <!-- Comic Action Explosive Radial Lines (Fire & Speed) -->
  <g stroke="#f97316" stroke-width="2.5" opacity="0.6" stroke-linecap="round">
    <line x1="140" y1="140" x2="20" y2="20"/>
    <line x1="140" y1="140" x2="80" y2="10"/>
    <line x1="140" y1="140" x2="200" y2="10"/>
    <line x1="140" y1="140" x2="260" y2="25"/>
    <line x1="140" y1="140" x2="270" y2="90"/>
    <line x1="140" y1="140" x2="265" y2="170"/>
    <line x1="140" y1="140" x2="260" y2="240"/>
    <line x1="140" y1="140" x2="20" y2="240"/>
    <line x1="140" y1="140" x2="10" y2="150"/>
    <line x1="140" y1="140" x2="15" y2="80"/>
  </g>

  <!-- Fiery Aura -->
  <circle cx="140" cy="140" r="120" fill="url(#fire-grad-nz)" opacity="0.25"/>

  <!-- Flaming Spear (火尖槍) in Left Hand -->
  <g id="fire-spear" filter="url(#glow-flame-nz)">
    <path d="M 50 250 L 50 30" stroke="#ca8a04" stroke-width="5" stroke-linecap="round"/>
    <!-- Spear Tip -->
    <path d="M 50 15 Q 60 30 50 50 Q 40 30 50 15 Z" fill="#ef4444" stroke="#0f172a" stroke-width="2"/>
    <!-- Spear Flames -->
    <path d="M 50 35 Q 65 30 55 10 Q 70 30 50 55 Q 30 30 45 10 Q 35 30 50 35 Z" fill="#facc15"/>
  </g>

  <!-- Big Qiankun Ring Glowing in Right Hand -->
  <g transform="translate(225, 90) rotate(15)" filter="url(#glow-flame-nz)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#0f172a" stroke-width="9"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#facc15" stroke-width="6"/>
  </g>

  <!-- Wind-Fire Wheels Leaping high -->
  <g id="wheels" filter="url(#glow-flame-nz)">
    <g transform="translate(95, 235)">
      <circle cx="0" cy="0" r="16" fill="url(#fire-grad-nz)" stroke="#0f172a" stroke-width="3"/>
    </g>
    <g transform="translate(185, 235)">
      <circle cx="0" cy="0" r="16" fill="url(#fire-grad-nz)" stroke="#0f172a" stroke-width="3"/>
    </g>
  </g>

  <!-- Body (Leaping Triumphant) -->
  <g id="body" filter="url(#comic-shadow-nz)">
    <path d="M 110 195 L 90 235 L 125 235 L 140 210 L 155 235 L 190 235 L 170 195 Z" fill="#e11d48" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 115 160 Q 140 175 165 160 L 175 200 Q 140 210 105 200 Z" fill="#a7f3d0" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 108 190 Q 140 198 172 190" stroke="#facc15" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="140" cy="193" r="6" fill="#10b981" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Arms (Raised High in V-sign & Holding Weapons) -->
  <g id="arms" filter="url(#comic-shadow-nz)">
    <!-- Left Hand grasping spear -->
    <path d="M 110 165 Q 75 140 55 125" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 110 165 Q 75 140 55 125" stroke="url(#skin-nz)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="55" cy="125" r="8" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>

    <!-- Right Hand Victory V-sign -->
    <path d="M 170 165 Q 200 130 215 105" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 170 165 Q 200 130 215 105" stroke="url(#skin-nz)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="215" cy="105" r="8" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
    <line x1="213" y1="100" x2="208" y2="86" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="219" y1="100" x2="224" y2="86" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Flowing Red Ribbons Spinning dynamically -->
  <g filter="url(#comic-shadow-nz)">
    <path d="M 40 120 C 10 70 80 40 140 50 C 200 60 270 40 240 130 C 210 110 180 80 140 85 C 90 90 60 110 40 120 Z" fill="url(#ribbon-grad-nz)" stroke="#0f172a" stroke-width="4"/>
  </g>

  <!-- Head Base -->
  <g id="hair-back" filter="url(#comic-shadow-nz)">
    <ellipse cx="140" cy="100" rx="56" ry="52" fill="#0f172a" stroke="#0f172a" stroke-width="4"/>
    <g transform="translate(80, 55)">
      <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#0f172a" stroke-width="4"/>
      <path d="M -12 12 Q -25 25 -35 20" stroke="#e11d48" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <circle cx="0" cy="0" r="10" fill="#e11d48" stroke="#0f172a" stroke-width="2"/>
    </g>
    <g transform="translate(200, 55)">
      <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#0f172a" stroke-width="4"/>
      <path d="M 12 12 Q 25 25 35 20" stroke="#e11d48" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <circle cx="0" cy="0" r="10" fill="#e11d48" stroke="#0f172a" stroke-width="2"/>
    </g>
  </g>

  <!-- Chibi Face -->
  <ellipse cx="140" cy="112" rx="48" ry="42" fill="url(#skin-nz)" stroke="#0f172a" stroke-width="4.5" filter="url(#comic-shadow-nz)"/>

  <!-- Cinnabar Mark -->
  <g transform="translate(140, 86)">
    <path d="M 0 -8 Q 6 0 0 8 Q -6 0 0 -8 Z" fill="#e11d48"/>
  </g>

  <!-- Bangs -->
  <path d="M 96 90 Q 115 105 125 92 Q 140 106 155 92 Q 165 105 184 90 Q 140 70 96 90 Z" fill="#0f172a"/>

  <!-- Big Red Rosy Cheeks -->
  <ellipse cx="100" cy="120" rx="11" ry="7" fill="#fb7185" opacity="0.8"/>
  <ellipse cx="180" cy="120" rx="11" ry="7" fill="#fb7185" opacity="0.8"/>

  <!-- Star / Joy Eyes (>< or Sparkly Eyes) -->
  <g id="eyes">
    <path d="M 108 108 Q 120 94 132 108" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 148 108 Q 160 94 172 108" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Little Sparkle under eyes -->
    <polygon points="120,116 122,120 126,121 123,124 124,128 120,125 116,128 117,124 114,121 118,120" fill="#facc15"/>
    <polygon points="160,116 162,120 166,121 163,124 164,128 160,125 156,128 157,124 154,121 158,120" fill="#facc15"/>
  </g>

  <!-- High Raised Happy Brows -->
  <path d="M 102 88 Q 118 80 130 88" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M 178 88 Q 162 80 150 88" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Big Laughing Open Mouth with Cute Little Fang -->
  <g id="mouth">
    <path d="M 124 122 Q 140 112 156 122 Q 140 150 124 122 Z" fill="#e11d48" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 130 135 Q 140 126 150 135" fill="#fda4af"/>
    <!-- Fang -->
    <path d="M 128 122 L 132 128 L 136 122 Z" fill="#ffffff"/>
  </g>
</svg>
