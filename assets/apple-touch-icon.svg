<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <linearGradient id="ati-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181411"/>
      <stop offset="50%" stop-color="#203847"/>
      <stop offset="100%" stop-color="#0d0a08"/>
    </linearGradient>
    <linearGradient id="ati-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="ati-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="180" height="180" rx="38" fill="url(#ati-bg)"/>
  <circle cx="90" cy="90" r="75" fill="url(#ati-glow)"/>
  <rect x="8" y="8" width="164" height="164" rx="32" fill="none" stroke="url(#ati-gold)" stroke-width="3" opacity="0.8"/>
  <circle cx="90" cy="90" r="62" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>

  <!-- Chinese Seal Box -->
  <rect x="42" y="42" width="96" height="96" rx="20" fill="#b92b27" stroke="url(#ati-gold)" stroke-width="3.5"/>
  <rect x="48" y="48" width="84" height="84" rx="14" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.7"/>

  <!-- Calligraphy Title -->
  <text x="90" y="82" font-family="'Noto Serif TC', serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">尋章</text>
  <text x="90" y="118" font-family="'Noto Serif TC', serif" font-weight="900" font-size="34" fill="#fef08a" text-anchor="middle" letter-spacing="2">摘句</text>

  <!-- Sparkles -->
  <circle cx="34" cy="34" r="4" fill="#facc15"/>
  <circle cx="146" cy="146" r="4" fill="#38bdf8"/>
</svg>
