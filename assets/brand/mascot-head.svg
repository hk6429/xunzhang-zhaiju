<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <filter id="head-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
    <filter id="head-gold-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="head-halo-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="head-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="head-cinnabar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="head-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <radialGradient id="head-blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Aura -->
  <circle cx="128" cy="128" r="115" fill="url(#head-halo-grad)" />
  <circle cx="128" cy="128" r="110" fill="none" stroke="url(#head-gold)" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Back Hair & Side Bobs -->
  <g filter="url(#head-drop-shadow)">
    <ellipse cx="128" cy="142" rx="86" ry="76" fill="#0f172a" />
    
    <!-- Side Hair Bundles -->
    <path d="M 52 145 Q 26 185 45 210 Q 64 220 78 190 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <path d="M 204 145 Q 230 185 211 210 Q 192 220 178 190 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

    <!-- Cute Robe Collar peaking at bottom -->
    <path d="M 70 230 Q 128 255 186 230 L 190 256 L 66 256 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
    <path d="M 128 238 L 128 256" stroke="#0ea5e9" stroke-width="5" />
    <path d="M 90 228 L 128 250 L 166 228" fill="none" stroke="#0284c7" stroke-width="3" />

    <!-- Chubby Face -->
    <ellipse cx="128" cy="148" rx="74" ry="66" fill="url(#head-skin)" stroke="#1e293b" stroke-width="4.5" />

    <!-- Cheeks Blush -->
    <ellipse cx="76" cy="162" rx="16" ry="10" fill="url(#head-blush)" />
    <ellipse cx="180" cy="162" rx="16" ry="10" fill="url(#head-blush)" />
    <circle cx="72" cy="159" r="2.8" fill="#ffffff" opacity="0.8" />
    <circle cx="184" cy="159" r="2.8" fill="#ffffff" opacity="0.8" />

    <!-- Bangs -->
    <path d="M 62 112 C 78 140 105 125 128 136 C 151 125 178 140 194 112 C 180 94 158 90 128 90 C 98 90 76 94 62 112 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2.5" />
    <path d="M 97 122 Q 110 134 123 123" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <path d="M 133 123 Q 146 134 159 122" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Forehead Talisman Mark -->
    <g transform="translate(128, 110)">
      <path d="M 0 -8 C 5 -3 5 3 0 8 C -5 3 -5 -3 0 -8 Z" fill="url(#head-cinnabar)" stroke="#991b1b" stroke-width="1" filter="url(#head-gold-glow)" />
      <circle cx="0" cy="0" r="1.8" fill="#fef08a" />
      <circle cx="0" cy="-11" r="1.5" fill="url(#head-cinnabar)" />
    </g>

    <!-- Eyes (Big Sparkling Ink Eyes) -->
    <!-- Left Eye -->
    <g>
      <ellipse cx="89" cy="148" rx="16.5" ry="21" fill="#090d16" stroke="#1e293b" stroke-width="2" />
      <ellipse cx="89" cy="153" rx="14" ry="14" fill="#1e1b4b" />
      <path d="M 77 157 Q 89 166 101 157" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />
      <ellipse cx="84" cy="139" rx="7" ry="9.5" fill="#ffffff" />
      <circle cx="97" cy="154" r="3.5" fill="#ffffff" />
      <circle cx="92" cy="135" r="1.8" fill="#ffffff" />
    </g>

    <!-- Right Eye -->
    <g>
      <ellipse cx="167" cy="148" rx="16.5" ry="21" fill="#090d16" stroke="#1e293b" stroke-width="2" />
      <ellipse cx="167" cy="153" rx="14" ry="14" fill="#1e1b4b" />
      <path d="M 155 157 Q 167 166 179 157" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />
      <ellipse cx="162" cy="139" rx="7" ry="9.5" fill="#ffffff" />
      <circle cx="175" cy="154" r="3.5" fill="#ffffff" />
      <circle cx="170" cy="135" r="1.8" fill="#ffffff" />
    </g>

    <!-- Eyebrows -->
    <path d="M 74 123 Q 89 116 105 123" fill="none" stroke="#334155" stroke-width="3.8" stroke-linecap="round" />
    <path d="M 151 123 Q 167 116 182 123" fill="none" stroke="#334155" stroke-width="3.8" stroke-linecap="round" />

    <!-- Cute Smile -->
    <path d="M 119 172 Q 128 184 137 172" fill="#e11d48" stroke="#881337" stroke-width="2.2" stroke-linecap="round" />
    <polygon points="125,173 131,173 128,176" fill="#ffffff" />

    <!-- Ears -->
    <ellipse cx="56" cy="152" rx="7" ry="10" fill="url(#head-skin)" stroke="#1e293b" stroke-width="2.5" />
    <ellipse cx="200" cy="152" rx="7" ry="10" fill="url(#head-skin)" stroke="#1e293b" stroke-width="2.5" />

    <!-- Topknot Bun & Taiji Crown -->
    <circle cx="128" cy="68" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="3.5" />
    <circle cx="128" cy="68" r="20" fill="url(#head-gold)" stroke="#78350f" stroke-width="2" filter="url(#head-gold-glow)" />
    
    <!-- Taiji Yin-Yang -->
    <circle cx="128" cy="68" r="15" fill="#0f172a" />
    <path d="M 128 53 A 15 15 0 0 1 128 83 A 7.5 7.5 0 0 1 128 68 A 7.5 7.5 0 0 0 128 53 Z" fill="#ffffff" />
    <circle cx="128" cy="60.5" r="2.5" fill="#0f172a" />
    <circle cx="128" cy="75.5" r="2.5" fill="#ffffff" />

    <!-- Golden Pin & Crimson Tassel -->
    <line x1="86" y1="68" x2="170" y2="68" stroke="url(#head-gold)" stroke-width="5" stroke-linecap="round" />
    <circle cx="170" cy="68" r="5" fill="url(#head-gold)" stroke="#78350f" stroke-width="1.5" />
    <circle cx="86" cy="68" r="3.5" fill="url(#head-gold)" stroke="#78350f" stroke-width="1.5" />
    
    <!-- Tassel -->
    <path d="M 170 70 Q 180 90 174 112 Q 170 125 177 140" fill="none" stroke="url(#head-cinnabar)" stroke-width="4.2" stroke-linecap="round" />
    <circle cx="177" cy="142" r="3" fill="url(#head-gold)" />
  </g>
</svg>
