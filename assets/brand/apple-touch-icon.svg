<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="ati-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b18" />
      <stop offset="60%" stop-color="#14110f" />
      <stop offset="100%" stop-color="#0a0807" />
    </linearGradient>
    <linearGradient id="ati-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="ati-cinnabar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="ati-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS App Icon Background (Apple clips automatically, but solid square standard) -->
  <rect x="0" y="0" width="180" height="180" fill="url(#ati-bg)" />
  
  <!-- Outer Gold Frame -->
  <rect x="8" y="8" width="164" height="164" rx="36" fill="none" stroke="url(#ati-gold)" stroke-width="3" />
  <rect x="14" y="14" width="152" height="152" rx="30" fill="none" stroke="#ca8a04" stroke-width="1" stroke-dasharray="6 4" opacity="0.5" />

  <!-- Background Taiji Aura -->
  <circle cx="90" cy="85" r="55" fill="#fde047" opacity="0.08" filter="url(#ati-glow)" />

  <!-- Mascot Center Head -->
  <g transform="translate(90, 86) scale(0.65) translate(-128, -128)">
    <!-- Back Hair -->
    <ellipse cx="128" cy="138" rx="74" ry="64" fill="#0f172a" />
    
    <!-- Robe Collar -->
    <path d="M 70 230 Q 128 255 186 230 L 190 256 L 66 256 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
    <path d="M 128 238 L 128 256" stroke="#0ea5e9" stroke-width="5" />

    <!-- Face -->
    <ellipse cx="128" cy="142" rx="66" ry="58" fill="#fff5f5" stroke="#1e293b" stroke-width="4" />
    
    <!-- Blush -->
    <ellipse cx="80" cy="154" rx="14" ry="8" fill="#fb7185" opacity="0.5" />
    <ellipse cx="176" cy="154" rx="14" ry="8" fill="#fb7185" opacity="0.5" />

    <!-- Bangs -->
    <path d="M 70 110 C 85 132 108 120 128 130 C 148 120 171 132 186 110 Z" fill="#0f172a" />

    <!-- Forehead Seal -->
    <path d="M 128 112 L 131 118 L 128 124 L 125 118 Z" fill="url(#ati-cinnabar)" />

    <!-- Eyes -->
    <ellipse cx="94" cy="143" rx="14" ry="18" fill="#090d16" />
    <ellipse cx="90" cy="135" rx="6" ry="8" fill="#ffffff" />
    <circle cx="101" cy="148" r="2.8" fill="#38bdf8" />

    <ellipse cx="162" cy="143" rx="14" ry="18" fill="#090d16" />
    <ellipse cx="158" cy="135" rx="6" ry="8" fill="#ffffff" />
    <circle cx="169" cy="148" r="2.8" fill="#38bdf8" />

    <!-- Smile -->
    <path d="M 120 163 Q 128 173 136 163" fill="#e11d48" stroke="#881337" stroke-width="2" stroke-linecap="round" />

    <!-- Taiji Topknot -->
    <circle cx="128" cy="72" r="28" fill="#0f172a" stroke="#1e293b" stroke-width="3" />
    <circle cx="128" cy="72" r="17" fill="url(#ati-gold)" stroke="#78350f" stroke-width="1.8" />
    <circle cx="128" cy="72" r="13" fill="#0f172a" />
    <path d="M 128 59 A 13 13 0 0 1 128 85 A 6.5 6.5 0 0 1 128 72 A 6.5 6.5 0 0 0 128 59 Z" fill="#ffffff" />
    <circle cx="128" cy="65.5" r="2" fill="#0f172a" />
    <circle cx="128" cy="78.5" r="2" fill="#ffffff" />
    <line x1="92" y1="72" x2="164" y2="72" stroke="url(#ati-gold)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 164 74 Q 174 94 168 116" fill="none" stroke="url(#ati-cinnabar)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Golden Brush Sparkle at Hand -->
  <g transform="translate(138, 118) rotate(-35)" filter="url(#ati-glow)">
    <rect x="-2" y="-12" width="4" height="20" rx="1.5" fill="#451a03" stroke="url(#ati-gold)" stroke-width="1" />
    <path d="M -3 -12 L 3 -12 L 0 -20 Z" fill="#0f172a" />
    <circle cx="0" cy="-20" r="2.5" fill="#fde047" />
  </g>

  <!-- Bottom App Title Tag "尋章摘句" -->
  <g transform="translate(90, 158)">
    <rect x="-42" y="-14" width="84" height="18" rx="5" fill="#1e293b" stroke="url(#ati-gold)" stroke-width="1" />
    <text x="0" y="-1" font-family="'Noto Serif TC', serif" font-weight="900" font-size="10.5" fill="#fde047" text-anchor="middle" letter-spacing="2">尋章摘句</text>
  </g>
</svg>
