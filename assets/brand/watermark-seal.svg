<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="seal-distress">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="seal-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
  </defs>

  <g id="antique-seal" filter="url(#seal-distress)" opacity="0.88">
    <!-- 外框硃砂印 (雙重金石方印) -->
    <rect x="10" y="10" width="180" height="180" rx="16" fill="none" stroke="url(#seal-red)" stroke-width="8" />
    <rect x="22" y="22" width="156" height="156" rx="10" fill="none" stroke="url(#seal-red)" stroke-width="2.5" />

    <!-- 十字界欄 (Quarter Divider) -->
    <line x1="100" y1="22" x2="100" y2="178" stroke="url(#seal-red)" stroke-width="3" />
    <line x1="22" y1="100" x2="178" y2="100" stroke="url(#seal-red)" stroke-width="3" />

    <!-- 經典篆刻四字：【右上：尋】【右下：摘】【左上：章】【左下：句】 (傳統由右至左、由上至下讀法：尋章摘句) -->
    <g font-family="'Noto Serif TC', 'Songti TC', 'Ma Shan Zheng', serif" font-weight="900" font-size="46" fill="url(#seal-red)" text-anchor="middle" dominant-baseline="central">
      <!-- 右上 (Top-Right): 尋 -->
      <text x="142" y="62">尋</text>
      <!-- 左上 (Top-Left): 章 -->
      <text x="58" y="62">章</text>
      <!-- 右下 (Bottom-Right): 摘 -->
      <text x="142" y="140">摘</text>
      <!-- 左下 (Bottom-Left): 句 -->
      <text x="58" y="140">句</text>
    </g>

    <!-- 四角太極印與金石微斑 (Corner antique notches) -->
    <circle cx="22" cy="22" r="3" fill="url(#seal-red)" />
    <circle cx="178" cy="22" r="3" fill="url(#seal-red)" />
    <circle cx="22" cy="178" r="3" fill="url(#seal-red)" />
    <circle cx="178" cy="178" r="3" fill="url(#seal-red)" />
    <!-- 斑駁氣孔 -->
    <circle cx="95" cy="45" r="1.5" fill="#f4ebd9" />
    <circle cx="130" cy="115" r="2" fill="#f4ebd9" />
    <circle cx="45" cy="155" r="1.8" fill="#f4ebd9" />
  </g>
</svg>
