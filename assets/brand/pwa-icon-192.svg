<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="pwa192-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="pwa192-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="pwa192-cinnabar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Base 192x192 Rounded Rect -->
  <rect x="4" y="4" width="184" height="184" rx="42" fill="url(#pwa192-bg)" stroke="url(#pwa192-gold)" stroke-width="3" />
  <rect x="10" y="10" width="172" height="172" rx="36" fill="none" stroke="#ca8a04" stroke-width="1" stroke-dasharray="6 4" opacity="0.5" />

  <!-- Center Mascot Head & Elements -->
  <g transform="translate(96, 92) scale(0.68) translate(-128, -128)">
    <ellipse cx="128" cy="138" rx="74" ry="64" fill="#0f172a" />
    <path d="M 70 230 Q 128 255 186 230 L 190 256 L 66 256 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
    <path d="M 128 238 L 128 256" stroke="#0ea5e9" stroke-width="5" />
    <ellipse cx="128" cy="142" rx="66" ry="58" fill="#fff5f5" stroke="#1e293b" stroke-width="4" />
    <ellipse cx="80" cy="154" rx="14" ry="8" fill="#fb7185" opacity="0.5" />
    <ellipse cx="176" cy="154" rx="14" ry="8" fill="#fb7185" opacity="0.5" />
    <path d="M 70 110 C 85 132 108 120 128 130 C 148 120 171 132 186 110 Z" fill="#0f172a" />
    <path d="M 128 112 L 131 118 L 128 124 L 125 118 Z" fill="url(#pwa192-cinnabar)" />
    <!-- Eyes -->
    <ellipse cx="94" cy="143" rx="14" ry="18" fill="#090d16" />
    <ellipse cx="90" cy="135" rx="6" ry="8" fill="#ffffff" />
    <circle cx="101" cy="148" r="2.8" fill="#38bdf8" />
    <ellipse cx="162" cy="143" rx="14" ry="18" fill="#090d16" />
    <ellipse cx="158" cy="135" rx="6" ry="8" fill="#ffffff" />
    <circle cx="169" cy="148" r="2.8" fill="#38bdf8" />
    <!-- Smile -->
    <path d="M 120 163 Q 128 173 136 163" fill="#e11d48" stroke="#881337" stroke-width="2" stroke-linecap="round" />
    <!-- Topknot -->
    <circle cx="128" cy="72" r="28" fill="#0f172a" stroke="#1e293b" stroke-width="3" />
    <circle cx="128" cy="72" r="17" fill="url(#pwa192-gold)" stroke="#78350f" stroke-width="1.8" />
    <circle cx="128" cy="72" r="13" fill="#0f172a" />
    <path d="M 128 59 A 13 13 0 0 1 128 85 A 6.5 6.5 0 0 1 128 72 A 6.5 6.5 0 0 0 128 59 Z" fill="#ffffff" />
    <circle cx="128" cy="65.5" r="2" fill="#0f172a" />
    <circle cx="128" cy="78.5" r="2" fill="#ffffff" />
    <line x1="92" y1="72" x2="164" y2="72" stroke="url(#pwa192-gold)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 164 74 Q 174 94 168 116" fill="none" stroke="url(#pwa192-cinnabar)" stroke-width="3.8" stroke-linecap="round" />
  </g>

  <!-- Bottom-Right Seal "尋" -->
  <g transform="translate(136, 136)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="url(#pwa192-cinnabar)" stroke="url(#pwa192-gold)" stroke-width="1.5" />
    <text x="19" y="27" font-family="'Noto Serif TC', serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">尋</text>
  </g>
</svg>
