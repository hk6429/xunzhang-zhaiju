<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%">
  <defs>
    <linearGradient id="hdr-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="hdr-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="hdr-cinnabar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="hdr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Mascot Avatar Disc (48px) -->
  <g transform="translate(6, 6)">
    <!-- Gold Rim Disc -->
    <circle cx="26" cy="26" r="25" fill="#fdfbf7" stroke="url(#hdr-gold)" stroke-width="2.2" />
    
    <!-- Mini Mascot Head -->
    <g transform="translate(26, 28) scale(0.24) translate(-128, -128)">
      <ellipse cx="128" cy="138" rx="74" ry="64" fill="#0f172a" />
      <ellipse cx="128" cy="142" rx="66" ry="58" fill="#fff5f5" stroke="#1e293b" stroke-width="4" />
      <ellipse cx="80" cy="154" rx="14" ry="8" fill="#fb7185" opacity="0.5" />
      <ellipse cx="176" cy="154" rx="14" ry="8" fill="#fb7185" opacity="0.5" />
      <path d="M 70 110 C 85 132 108 120 128 130 C 148 120 171 132 186 110 Z" fill="#0f172a" />
      <path d="M 128 112 L 131 118 L 128 124 L 125 118 Z" fill="url(#hdr-cinnabar)" />
      <!-- Eyes -->
      <ellipse cx="94" cy="143" rx="14" ry="18" fill="#090d16" />
      <ellipse cx="90" cy="135" rx="6" ry="8" fill="#ffffff" />
      <circle cx="101" cy="148" r="2.8" fill="#38bdf8" />
      <ellipse cx="162" cy="143" rx="14" ry="18" fill="#090d16" />
      <ellipse cx="158" cy="135" rx="6" ry="8" fill="#ffffff" />
      <circle cx="169" cy="148" r="2.8" fill="#38bdf8" />
      <!-- Smile -->
      <path d="M 120 163 Q 128 173 136 163" fill="#e11d48" stroke="#881337" stroke-width="2" stroke-linecap="round" />
      <!-- Topknot -->
      <circle cx="128" cy="72" r="28" fill="#0f172a" />
      <circle cx="128" cy="72" r="17" fill="url(#hdr-gold)" stroke="#78350f" stroke-width="1.8" />
      <circle cx="128" cy="72" r="13" fill="#0f172a" />
      <path d="M 128 59 A 13 13 0 0 1 128 85 A 6.5 6.5 0 0 1 128 72 A 6.5 6.5 0 0 0 128 59 Z" fill="#ffffff" />
      <line x1="92" y1="72" x2="164" y2="72" stroke="url(#hdr-gold)" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 164 74 Q 174 94 168 116" fill="none" stroke="url(#hdr-cinnabar)" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Mini Brush Sparkle -->
    <g transform="translate(42, 38) rotate(-35)" filter="url(#hdr-glow)">
      <rect x="-1" y="-8" width="2.5" height="12" rx="1" fill="#451a03" />
      <path d="M -1.5 -8 L 1.5 -8 L 0 -13 Z" fill="#0f172a" />
      <circle cx="0" cy="-13" r="1.5" fill="#fde047" />
    </g>
  </g>

  <!-- Title "尋章摘句" -->
  <g transform="translate(68, 38)">
    <text x="0" y="0" font-family="'Noto Serif TC', 'Songti TC', 'Source Han Serif TC', serif" font-weight="900" font-size="29" fill="url(#hdr-ink)" letter-spacing="4">
      尋章摘句
    </text>
  </g>

  <!-- Cinnabar Mini-Seal "封神" -->
  <g transform="translate(240, 15)">
    <rect x="0" y="0" width="34" height="34" rx="6" fill="url(#hdr-cinnabar)" stroke="url(#hdr-gold)" stroke-width="1.5" />
    <rect x="2" y="2" width="30" height="30" rx="4" fill="none" stroke="#fecaca" stroke-width="0.8" opacity="0.6" />
    <text x="17" y="15" font-family="'Noto Serif TC', serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">封</text>
    <text x="17" y="27" font-family="'Noto Serif TC', serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">神</text>
  </g>

  <!-- Subtitle Tag -->
  <g transform="translate(70, 52)">
    <text x="0" y="0" font-family="'Noto Serif TC', serif" font-weight="600" font-size="9" fill="#854d0e" letter-spacing="1.5">
      文道試煉・密室逃脫
    </text>
  </g>
</svg>
