name: 尋章摘句使用支援
description: 回報 App 或網頁版的操作、進度與顯示問題
title: "[支援] "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        謝謝你協助改善尋章摘句。此回報會公開顯示，請勿填寫姓名、電子郵件、學校、班級、登入憑證、帳號識別碼或其他個人資料。
  - type: dropdown
    id: platform
    attributes:
      label: 使用平台
      options:
        - iPhone
        - iPad
        - Web 網頁版
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系統與版本
      description: 例如 iOS 18.6；不確定時可填「不清楚」。
      placeholder: iOS／iPadOS／瀏覽器版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 發生經過
      description: 請依順序描述操作步驟，以及原本預期與實際看到的結果。
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: 畫面訊息
      description: 可貼上不含個人資料的錯誤文字或截圖。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 隱私確認
      options:
        - label: 我已確認內容不含個人資料、登入憑證或帳號識別碼。
          required: true
