name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-worker:
    name: Web and Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate content and repository
        run: |
          node tools/build-app-content-manifest.mjs --check
          node tools/validate.mjs data/phrases.json data/levels.json
          node tools/validate-visuals.mjs
          node tools/scan-secrets.mjs
          node --test tests/*.test.js
      - name: Install Worker dependencies
        run: npm --prefix sync-worker ci
      - name: Validate Worker
        run: |
          npm --prefix sync-worker run typecheck
          npm --prefix sync-worker test
          npm --prefix sync-worker run dry-run

  ios:
    name: iOS and iPadOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install build tools
        run: brew install xcodegen ripgrep
      - name: Validate App Store assets and generate project
        run: |
          node tools/build-app-content-manifest.mjs --check
          node tools/validate-app-store-assets.mjs
          xcodegen --spec ios/project.yml
          xcodebuild -resolvePackageDependencies -project ios/XunZhangZhaiJu.xcodeproj
      - name: Select available simulators
        run: |
          iphone_udid=$(xcrun simctl list devices available | sed -nE '/iPhone/ s/.*\(([0-9A-F-]{36})\) \((Booted|Shutdown)\).*/\1/p' | head -n 1)
          ipad_udid=$(xcrun simctl list devices available | sed -nE '/iPad/ s/.*\(([0-9A-F-]{36})\) \((Booted|Shutdown)\).*/\1/p' | head -n 1)
          test -n "$iphone_udid"
          test -n "$ipad_udid"
          echo "IPHONE_UDID=$iphone_udid" >> "$GITHUB_ENV"
          echo "IPAD_UDID=$ipad_udid" >> "$GITHUB_ENV"
      - name: Test iPhone
        run: |
          xcodebuild test \
            -project ios/XunZhangZhaiJu.xcodeproj \
            -scheme XunZhangZhaiJu \
            -destination "platform=iOS Simulator,id=$IPHONE_UDID" \
            -resultBundlePath "$RUNNER_TEMP/iPhone.xcresult"
      - name: Test iPad
        run: |
          xcodebuild test \
            -project ios/XunZhangZhaiJu.xcodeproj \
            -scheme XunZhangZhaiJu \
            -destination "platform=iOS Simulator,id=$IPAD_UDID" \
            -only-testing:XunZhangZhaiJuUITests \
            -resultBundlePath "$RUNNER_TEMP/iPad.xcresult"
      - name: Build and validate unsigned Release Archive
        run: |
          archive_path="$RUNNER_TEMP/XunZhangZhaiJu.xcarchive"
          xcodebuild archive \
            -project ios/XunZhangZhaiJu.xcodeproj \
            -scheme XunZhangZhaiJu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            CODE_SIGNING_ALLOWED=NO
          tools/validate-ios-archive.sh "$archive_path"
          if strings "$archive_path/Products/Applications/XunZhangZhaiJu.app/XunZhangZhaiJu" | rg -q 'UI_TEST_'; then
            echo 'Release binary contains a Debug UI test switch' >&2
            exit 1
          fi
      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results-${{ github.run_id }}
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
