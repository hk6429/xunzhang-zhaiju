<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b18" />
      <stop offset="60%" stop-color="#14110f" />
      <stop offset="100%" stop-color="#0a0807" />
    </linearGradient>
    <linearGradient id="fav-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="fav-cinnabar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="fav-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f5" />
      <stop offset="100%" stop-color="#fde2d0" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#fav-bg)" stroke="url(#fav-gold)" stroke-width="2.5" />
  
  <!-- Subtle Taiji Watermark in BG -->
  <path d="M 32 10 A 22 22 0 0 1 32 54 A 11 11 0 0 1 32 32 A 11 11 0 0 0 32 10 Z" fill="#292524" opacity="0.35" />

  <!-- Topknot / Taiji Bun (髮髻) -->
  <circle cx="32" cy="14" r="8.5" fill="#1c1917" stroke="url(#fav-gold)" stroke-width="1.5" />
  <!-- Taiji Yin-Yang in Bun -->
  <path d="M 32 7.5 A 6.5 6.5 0 0 1 32 20.5 A 3.25 3.25 0 0 1 32 14 A 3.25 3.25 0 0 0 32 7.5 Z" fill="#f8fafc" />
  <circle cx="32" cy="10.8" r="1.2" fill="#1c1917" />
  <circle cx="32" cy="17.2" r="1.2" fill="#f8fafc" />
  <!-- Bun Hairpin Gold Bead & Red Tassel -->
  <line x1="22" y1="14" x2="42" y2="14" stroke="url(#fav-gold)" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="42" cy="14" r="2" fill="url(#fav-gold)" />
  <path d="M 42 16 Q 44 20 42 24" stroke="url(#fav-cinnabar)" stroke-width="1.8" fill="none" stroke-linecap="round" />

  <!-- Chibi Head (仙童軟萌大臉) -->
  <ellipse cx="32" cy="34" rx="20" ry="17" fill="url(#fav-skin)" stroke="#262626" stroke-width="1.8" />

  <!-- Side Hair Bunches -->
  <path d="M 12 30 Q 14 22 20 23 C 18 28 14 34 12 30 Z" fill="#1c1917" />
  <path d="M 52 30 Q 50 22 44 23 C 46 28 50 34 52 30 Z" fill="#1c1917" />

  <!-- Bangs -->
  <path d="M 20 24 Q 26 29 32 25 Q 38 29 44 24 Q 38 20 32 20 Q 26 20 20 24 Z" fill="#1c1917" />

  <!-- Rosy Blush (腮紅) -->
  <ellipse cx="19" cy="38" rx="3.8" ry="2.2" fill="#f43f5e" opacity="0.45" />
  <ellipse cx="45" cy="38" rx="3.8" ry="2.2" fill="#f43f5e" opacity="0.45" />

  <!-- Big Chibi Sparkling Ink Eyes -->
  <!-- Left Eye -->
  <ellipse cx="24" cy="33" rx="4.2" ry="5.5" fill="#0f172a" />
  <ellipse cx="23" cy="31" rx="1.8" ry="2.4" fill="#ffffff" />
  <circle cx="25.5" cy="35" r="0.9" fill="#93c5fd" />
  <!-- Right Eye -->
  <ellipse cx="40" cy="33" rx="4.2" ry="5.5" fill="#0f172a" />
  <ellipse cx="39" cy="31" rx="1.8" ry="2.4" fill="#ffffff" />
  <circle cx="41.5" cy="35" r="0.9" fill="#93c5fd" />

  <!-- Cute Eyebrows & Smile -->
  <path d="M 21 26 Q 24 24 27 26" stroke="#475569" stroke-width="1.2" stroke-linecap="round" fill="none" />
  <path d="M 37 26 Q 40 24 43 26" stroke="#475569" stroke-width="1.2" stroke-linecap="round" fill="none" />
  <path d="M 30 41 Q 32 44 34 41" stroke="#e11d48" stroke-width="1.4" stroke-linecap="round" fill="none" />

  <!-- Forehead Vermilion Dot (硃砂仙印) -->
  <path d="M 32 25.5 L 33 27.5 L 32 29.5 L 31 27.5 Z" fill="url(#fav-cinnabar)" />

  <!-- Taoist Robe Collar & Seal Ribbon -->
  <path d="M 20 48 Q 32 54 44 48 L 46 60 Q 32 63 18 60 Z" fill="#f8fafc" stroke="#1c1917" stroke-width="1.2" />
  <path d="M 32 49 L 32 60" stroke="#0ea5e9" stroke-width="2" />

  <!-- Right Hand holding Magic Brush Tip with Gold Glow Sparkle -->
  <g transform="translate(43, 38) rotate(-25)">
    <!-- Brush Handle -->
    <rect x="-2" y="-14" width="4" height="14" rx="1.5" fill="#78350f" stroke="url(#fav-gold)" stroke-width="0.8" />
    <!-- Brush Tip -->
    <path d="M -3 0 Q 0 8 0 10 Q 0 8 3 0 Z" fill="#18181b" />
    <path d="M -1 0 Q 0 5 0 8 Q 0 5 1 0 Z" fill="#38bdf8" />
    <!-- Golden Magic Sparkle -->
    <circle cx="0" cy="11" r="2.2" fill="url(#fav-gold)" filter="url(#fav-glow)" />
    <polygon points="0,7 1.5,10.5 5,11 1.5,11.5 0,15 -1.5,11.5 -5,11 -1.5,10.5" fill="#fef08a" transform="translate(0, 11) scale(0.6)" />
  </g>
</svg>
